<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qian's Drive</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bdb'/%3E%3Cpath d='M8 12a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#5b4bdb; --accent-2:#7c6cf0; --accent-soft:#efedff;
  --bg:#ffffff; --bg-2:#f7f7f8; --line:#ececef; --text:#1e1919; --muted:#6f6b75; --hover:#f4f3f7;
  --radius:10px; --shadow:0 12px 40px rgba(20,16,40,.18);
  --font:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
/* sidebar */
.side{border-right:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;box-shadow:0 4px 12px rgba(91,75,219,.35)}
.brand .logo svg{width:18px;height:18px}
.nav{padding:4px 10px;overflow:auto;flex:1}
.nav-sec{font-size:12px;color:var(--muted);padding:14px 10px 6px;font-weight:600}
.tree-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;color:#3b3740;white-space:nowrap;user-select:none}
.tree-item:hover{background:var(--hover)}
.tree-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-item .tw{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.tree-item .tw.open{transform:rotate(90deg)}
.tree-item .tw.none{visibility:hidden}
.tree-item .ic{width:18px;height:18px;flex:none}
.tree-item .lbl{overflow:hidden;text-overflow:ellipsis}
.tree-children{display:none}
.tree-children.open{display:block}
.quota{margin:12px 16px 18px;padding:14px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.quota .t{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.bar{height:6px;border-radius:6px;background:#ebe9f3;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px}
.ro{margin-top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.menu-btn{display:none;border:0;background:none;padding:6px;border-radius:8px}
.menu-btn:hover{background:var(--hover)}
.search{flex:1;max-width:620px;display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid transparent;border-radius:10px;padding:0 12px;height:40px;transition:all .15s}
.search:focus-within{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,75,219,.15)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:14px;min-width:0}
.search .clear{border:0;background:none;color:var(--muted);display:none;padding:2px}
.top .spacer{flex:1}
.badge{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.head{padding:20px 24px 8px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:22px;font-weight:700;flex:1;min-width:0}
.crumbs a{padding:2px 6px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600}
.crumbs a:hover{background:var(--hover);color:var(--text)}
.crumbs a.cur{color:var(--text);font-weight:700}
.crumbs .sep{color:#c4c1cc;font-weight:400}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 10px;color:var(--muted);display:grid;place-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
select.sort{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;background:#fff;color:var(--text)}
.sub{padding:0 30px 10px;color:var(--muted);font-size:13px}
.content{flex:1;overflow:auto;padding:0 24px 40px}
/* list */
table.list{width:100%;border-collapse:collapse;table-layout:fixed}
.list th{position:sticky;top:0;background:#fff;text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;z-index:2}
.list th:hover{color:var(--text)}
.list th .arr{opacity:.7;margin-left:4px}
.list td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list tr.row{cursor:pointer;transition:background .1s}
.list tr.row:hover{background:var(--hover)}
.list tr.row:hover .acts{opacity:1}
.list .c-size,.list .c-time{color:var(--muted);width:130px}
.list .c-time{width:170px}
.list .c-act{width:96px;text-align:right}
.namecell{display:flex;align-items:center;gap:12px;min-width:0}
.namecell .nm{overflow:hidden;text-overflow:ellipsis}
.namecell .path{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.fi{width:32px;height:32px;flex:none}
.acts{opacity:0;display:inline-flex;gap:4px;transition:opacity .1s}
.iconbtn{border:0;background:none;width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:#e9e7f0;color:var(--text)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding-top:6px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:box-shadow .15s,transform .15s,border-color .15s}
.card:hover{box-shadow:0 8px 24px rgba(30,25,60,.10);transform:translateY(-2px);border-color:#dedbe8}
.card .thumb{height:118px;display:grid;place-items:center;background:var(--bg-2);position:relative;overflow:hidden}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover}
.card .thumb .fi{width:56px;height:56px}
.card .thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 6px;font-size:11px}
.card .meta{padding:10px 12px}
.card .meta .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta .s{color:var(--muted);font-size:12px;margin-top:3px}
.empty{padding:80px 20px;text-align:center;color:var(--muted)}
.empty svg{width:120px;height:120px;opacity:.9}
/* preview */
.ov{position:fixed;inset:0;background:rgba(18,14,30,.72);backdrop-filter:blur(4px);z-index:50;display:none;flex-direction:column}
.ov.open{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pv-top{display:flex;align-items:center;gap:12px;padding:12px 18px;color:#fff}
.pv-top .t{flex:1;min-width:0}
.pv-top .t .n{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-top .t .m{font-size:12px;opacity:.7;margin-top:2px}
.pv-btn{border:0;background:rgba(255,255,255,.12);color:#fff;padding:8px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.pv-btn:hover{background:rgba(255,255,255,.22)}
.pv-btn.primary{background:var(--accent)}
.pv-btn.primary:hover{background:var(--accent-2)}
.pv-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 60px 24px;position:relative}
.pv-body img,.pv-body video{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow);background:#000}
.pv-body iframe{width:min(1100px,100%);height:100%;border:0;border-radius:8px;background:#fff;box-shadow:var(--shadow)}
.pv-body .audio{background:#fff;border-radius:16px;padding:32px;width:min(520px,100%);text-align:center;box-shadow:var(--shadow)}
.pv-body .audio .fi{width:84px;height:84px;margin-bottom:14px}
.pv-body .audio audio{width:100%;margin-top:16px}
.pv-body .text{background:#fff;border-radius:8px;width:min(960px,100%);height:100%;overflow:auto;padding:28px 34px;box-shadow:var(--shadow);line-height:1.7}
.pv-body .text pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;margin:0}
.pv-body .nopv{background:#fff;border-radius:16px;padding:40px;text-align:center;box-shadow:var(--shadow)}
.pv-body .nopv .fi{width:84px;height:84px}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.nav-arrow:hover{background:rgba(255,255,255,.26)}
.nav-arrow.l{left:10px}.nav-arrow.r{right:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1e1919;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{display:none}
/* responsive */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:none}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .menu-btn{display:grid;place-items:center}
  .top{padding:10px 12px;gap:8px}
  .badge{display:none}
  .head{padding:14px 14px 6px}
  .crumbs{font-size:18px;flex-basis:100%}
  .tools{margin-left:auto}
  html,body{overflow-x:hidden}
  .sub{padding:0 18px 8px}
  .content{padding:0 8px 40px}
  .list .c-time,.list th.c-time{display:none}
  .list .c-size{width:84px}
  .list .c-act{width:48px;padding-left:0;padding-right:4px}
  .list td,.list th{padding-left:8px;padding-right:8px}
  .acts{opacity:1}
  .acts .copy{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .pv-body{padding:0 8px 12px}
  .nav-arrow{display:none}
  .pv-btn .lbl{display:none}
}
</style>
</head>

        </div>
      </div>
    </div>
    <div class="sub" id="sub"></div>
    <section class="content" id="content"></section>
  </main>
</div>

<div class="ov" id="ov">
  <div class="pv-top">
    <button class="pv-btn" id="pvClose" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="t"><div class="n" id="pvName"></div><div class="m" id="pvMeta"></div></div>
    <button class="pv-btn" id="pvCopy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span class="lbl">复制链接</span></button>

  </div>
  <div class="pv-body" id="pvBody"></div>
</div>
<div class="toast" id="toast"></div>

  l:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>',
  r:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>'};
var FOLDER_ALIAS={"xhs":"小红书","videos":"视频","feishu":"飞书","export":"导出文档","docs":"文档","reports":"报告","intake":"资料整理","bilibili":"B 站","xiaoyuzhou":"小宇宙"};
function dname(seg){return FOLDER_ALIAS[seg]?seg+" · "+FOLDER_ALIAS[seg]:seg}

function build(){
  files=(M.files||[]).map(function(f){var p=f.key.split("/");return{key:f.key,size:f.size,mtime:f.mtime,type:f.type,name:p[p.length-1],dir:p.slice(0,-1).join("/")}});
  files.forEach(function(f){f.kind=kind(f)});
  tree={name:"",path:"",children:{},files:[],size:0,count:0,mtime:0};
  files.forEach(function(f){var node=tree,parts=f.dir?f.dir.split("/"):[];
    node.size+=f.size;node.count++;node.mtime=Math.max(node.mtime,f.mtime);
    parts.forEach(function(seg,i){if(!node.children[seg])node.children[seg]={name:seg,path:parts.slice(0,i+1).join("/"),children:{},files:[],size:0,count:0,mtime:0};node=node.children[seg];node.size+=f.size;node.count++;node.mtime=Math.max(node.mtime,f.mtime)});
    node.files.push(f)});
  var total=tree.size;$("usedTxt").textContent=human(total);
  $("usedBar").style.width=Math.max(3,Math.min(100,total/ (5*1024*1024*1024)*100))+"%";
  $("countBadge").textContent=files.length+" 个文件 · 只读";
}
function nodeAt(path){var n=tree;if(!path)return n;var ps=path.split("/");for(var i=0;i<ps.length;i++){n=n.children[ps[i]];if(!n)return null}return n}

var openSet={};
function renderTree(){
  function walk(node,depth){var h="";Object.keys(node.children).sort().forEach(function(k){var c=node.children[k],has=Object.keys(c.children).length>0,open=!!openSet[c.path];
    var active=state.mode==="folder"&&state.path===c.path;
    h+='<div class="tree-item'+(active?" active":"")+'" data-path="'+esc(c.path)+'" style="padding-left:'+(8+depth*14)+'px"><span class="tw'+(has?(open?" open":""):" none")+'" data-tw="1">'+IC.chev+'</span>'+icon("folder","ic")+'<span class="lbl">'+esc(depth===0?dname(c.name):(FOLDER_ALIAS[c.name]?dname(c.name):c.name))+'</span></div>';
    if(has)h+='<div class="tree-children'+(open?" open":"")+'">'+walk(c,depth+1)+'</div>'});return h}
  var rootActive=state.mode==="folder"&&state.path==="";
  $("tree").innerHTML='<div class="tree-item'+(rootActive?" active":"")+'" data-path=""><span class="tw none"></span>'+icon("folder","ic")+'<span class="lbl">全部文件</span></div>'+walk(tree,0);
  document.querySelector('[data-nav="recent"]').classList.toggle("active",state.mode==="recent");
}

function currentItems(){
  var folders=[],list=[];
  if(state.q){var q=state.q.toLowerCase();list=files.filter(function(f){return f.key.toLowerCase().indexOf(q)>=0||(f.dir&&f.dir.split("/").some(function(s){return (FOLDER_ALIAS[s]||"").indexOf(state.q)>=0}))});}
  else if(state.mode==="recent"){list=files.slice().sort(function(a,b){return b.mtime-a.mtime}).slice(0,30);return{folders:[],files:list,flat:true,keepOrder:true}}
  else{var n=nodeAt(state.path)||tree;folders=Object.keys(n.children).map(function(k){return n.children[k]});list=n.files.slice()}
  var s=state.sort,d=state.dir;
  var cmp=function(a,b){var r=0;if(s==="size")r=a.size-b.size;else if(s==="time")r=a.mtime-b.mtime;else if(s==="type")r=(a.kind||"").localeCompare(b.kind||"")||a.name.localeCompare(b.name,"zh");else r=a.name.localeCompare(b.name,"zh");return r*d};
  folders.sort(function(a,b){var r=s==="size"?a.size-b.size:s==="time"?a.mtime-b.mtime:a.name.localeCompare(b.name,"zh");return r*(s==="name"||s==="type"?d:d)});
  list.sort(cmp);
  return{folders:folders,files:list,flat:!!state.q};
}

function renderCrumbs(){
  var h="";
  if(state.q){h='<a class="cur">搜索 “'+esc(state.q)+'”</a>'}
  else if(state.mode==="recent"){h='<a class="cur">最近</a>'}
  else{h+='<a data-path=""'+(state.path?"":' class="cur"')+'>全部文件</a>';
    if(state.path){var ps=state.path.split("/");ps.forEach(function(seg,i){var p=ps.slice(0,i+1).join("/");h+='<span class="sep">›</span><a data-path="'+esc(p)+'"'+(i===ps.length-1?' class="cur"':"")+'>'+esc(seg)+'</a>'})}}
  $("crumbs").innerHTML=h;
}

var shown=[];
function render(){
  renderCrumbs();renderTree();
  var it=currentItems();shown=it.files;
  var n=state.q||state.mode==="recent"?null:nodeAt(state.path);
  var sub=[];
  if(it.folders.length)sub.push(it.folders.length+" 个文件夹");
  sub.push(it.files.length+" 个文件");
  if(n)sub.push("共 "+human(n.size));
  else if(state.q)sub.push("在全部文件中搜索");
  $("sub").textContent=sub.join(" · ");
  $("vList").classList.toggle("on",state.view==="list");$("vGrid").classList.toggle("on",state.view==="grid");
  $("sort").value=state.sort;
  var c=$("content");
  if(!it.folders.length&&!it.files.length){c.innerHTML='<div class="empty"><svg viewBox="0 0 120 120" fill="none"><rect x="20" y="34" width="80" height="58" rx="10" fill="#efedff"/><path d="M20 44a10 10 0 0 1 10-10h18l7 8h35a10 10 0 0 1 10 10" stroke="#a99ff7" stroke-width="3"/><circle cx="60" cy="64" r="10" stroke="#8f83f3" stroke-width="3"/><path d="m67 71 8 8" stroke="#8f83f3" stroke-width="3" stroke-linecap="round"/></svg><div style="margin-top:12px;font-size:15px;color:#3b3740">'+(state.q?"没有找到匹配的文件":"这个文件夹是空的")+'</div></div>';return}
  if(state.view==="list"){
    var arr=function(k){return state.sort===k?'<span class="arr">'+(state.dir>0?"↑":"↓")+'</span>':""};
    var h='<table class="list"><thead><tr><th data-sort="name">名称'+arr("name")+'</th><th class="c-time" data-sort="time">修改时间'+arr("time")+'</th><th class="c-size" data-sort="size">大小'+arr("size")+'</th><th class="c-act"></th></tr></thead><tbody>';
    it.folders.forEach(function(f){h+='<tr class="row" data-folder="'+esc(f.path)+'"><td><div class="namecell">'+icon("folder")+'<div style="min-width:0"><div class="nm">'+esc(dname(f.name))+'</div></div></div></td><td class="c-time">'+fmtTime(f.mtime)+'</td><td class="c-size">'+f.count+' 项</td><td class="c-act"></td></tr>'});
    it.files.forEach(function(f,i){h+='<tr class="row" data-i="'+i+'"><td><div class="namecell">'+icon(f.kind)+'<div style="min-width:0"><div class="nm" title="'+esc(f.name)+'">'+esc(f.name)+'</div>'+(it.flat&&f.dir?'<div class="path">'+esc(f.dir)+'</div>':"")+'</div></div></td><td class="c-time" title="'+fmtTime(f.mtime)+'">'+fmtTime(f.mtime)+'</td><td class="c-size">'+human(f.size)+'</td><td class="c-act"><span class="acts"><button class="iconbtn copy" data-copy="'+i+'" title="复制链接">'+IC.link+'</button><a class="iconbtn" href="'+url(f)+'" download="'+esc(f.name)+'" target="_blank" rel="noopener" title="下载" data-stop="1">'+IC.dl+'</a></span></td></tr>'});
    c.innerHTML=h+"</tbody></table>";
  }else{
    var g='<div class="grid">';
    it.folders.forEach(function(f){g+='<div class="card" data-folder="'+esc(f.path)+'"><div class="thumb">'+icon("folder")+'</div><div class="meta"><div class="nm">'+esc(dname(f.name))+'</div><div class="s">'+f.count+' 项 · '+human(f.size)+'</div></div></div>'});
    it.files.forEach(function(f,i){var th=f.kind==="image"?'<img loading="lazy" src="'+url(f)+'" alt="">':f.kind==="video"?'<video preload="metadata" muted playsinline src="'+url(f)+'#t=1"></video><span class="dur">视频</span>':icon(f.kind);
      g+='<div class="card" data-i="'+i+'"><div class="thumb">'+th+'</div><div class="meta"><div class="nm" title="'+esc(f.name)+'">'+esc(f.name)+'</div><div class="s">'+human(f.size)+' · '+relTime(f.mtime)+'</div></div></div>'});
    c.innerHTML=g+"</div>";
  }
}

/* preview */
var cur=-1;
function preview(i){
  cur=i;var f=shown[i];if(!f)return;var u=url(f),b=$("pvBody");
  $("pvName").textContent=f.name;
  $("pvMeta").textContent=[KLABEL[f.kind]||"文件",human(f.size),fmtTime(f.mtime),f.dir||"根目录"].join(" · ");
  $("pvDl").href=u;$("pvDl").setAttribute("download",f.name);
  var h="";
  if(f.kind==="image")h='<img src="'+u+'" alt="">';
  else if(f.kind==="video")h='<video src="'+u+'" controls autoplay playsinline></video>';
  else if(f.kind==="audio")h='<div class="audio">'+icon("audio")+'<div style="font-weight:600;word-break:break-all">'+esc(f.name)+'</div><audio src="'+u+'" controls autoplay></audio></div>';
  else if(f.kind==="pdf")h='<iframe src="'+u+'#view=FitH" title="'+esc(f.name)+'"></iframe>';
  else if(f.kind==="text")h='<div class="text"><pre>加载中…</pre></div>';
  else h='<div class="nopv">'+icon(f.kind)+'<div style="margin:14px 0 18px;font-weight:600;word-break:break-all">'+esc(f.name)+'</div><a class="pv-btn primary" href="'+u+'" target="_blank" rel="noopener">'+IC.dl+' 下载查看</a></div>';
  if(shown.length>1)h+='<button class="nav-arrow l" id="pvPrev" aria-label="上一个">'+IC.l+'</button><button class="nav-arrow r" id="pvNext" aria-label="下一个">'+IC.r+'</button>';
  b.innerHTML=h;
  if(f.kind==="text"){fetch(u).then(function(r){return r.text()}).then(function(t){var pre=b.querySelector("pre");if(pre)pre.textContent=t.length>500000?t.slice(0,500000)+"\n…（内容过长，已截断）":t}).catch(function(){var pre=b.querySelector("pre");if(pre)pre.textContent="无法加载预览，请下载查看。"})}
  $("ov").classList.add("open");document.body.style.overflow="hidden";
  history.replaceState(null,"","#"+encodeURIComponent((state.mode==="recent"?"~recent":state.path))+"?f="+encodeURIComponent(f.key));
}
function closePv(){$("ov").classList.remove("open");$("pvBody").innerHTML="";document.body.style.overflow="";cur=-1;syncHash()}
function step(d){if(cur<0)return;preview((cur+d+shown.length)%shown.length)}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove("show")},1600)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("链接已复制")}).catch(function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("链接已复制")}catch(e){toast(t)}a.remove()})}

function syncHash(){var h=state.mode==="recent"?"~recent":state.path;history.replaceState(null,"",h?"#"+encodeURIComponent(h):location.pathname+location.search)}
function go(path){state.mode="folder";state.path=path;state.q="";$("q").value="";$("qClear").style.display="none";
  if(path){var ps=path.split("/");for(var i=1;i<=ps.length;i++)openSet[ps.slice(0,i).join("/")]=true}
  closeSide();syncHash();render();$("content").scrollTop=0}
function closeSide(){$("side").classList.remove("open");$("scrim").classList.remove("open")}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest("[data-stop]"))return;
  var cp=t.closest("[data-copy]");if(cp){e.stopPropagation();copy(url(shown[+cp.getAttribute("data-copy")]));return}
  var tw=t.closest("[data-tw]");var ti=t.closest(".tree-item[data-path]");
  if(tw&&ti&&!tw.classList.contains("none")){var p=ti.getAttribute("data-path");openSet[p]=!openSet[p];renderTree();return}
  if(ti){go(ti.getAttribute("data-path"));return}
  if(t.closest('[data-nav="recent"]')){state.mode="recent";state.q="";$("q").value="";closeSide();syncHash();render();return}
  var cr=t.closest("#crumbs a[data-path]");if(cr){go(cr.getAttribute("data-path"));return}
  var fo=t.closest("[data-folder]");if(fo){go(fo.getAttribute("data-folder"));return}
  var fi=t.closest("[data-i]");if(fi){preview(+fi.getAttribute("data-i"));return}
  var th=t.closest("th[data-sort]");if(th){var s=th.getAttribute("data-sort");if(state.sort===s)state.dir*=-1;else{state.sort=s;state.dir=s==="name"?1:-1}localStorage.setItem("qd_sort",state.sort);render();return}
  if(t.closest("#pvPrev")){step(-1);return}
  if(t.closest("#pvNext")){step(1);return}
});
$("pvClose").onclick=closePv;
$("ov").addEventListener("click",function(e){if(e.target.id==="pvBody")closePv()});
$("pvCopy").onclick=function(){if(cur>=0)copy(url(shown[cur]))};
$("vList").onclick=function(){state.view="list";localStorage.setItem("qd_view","list");render()};
$("vGrid").onclick=function(){state.view="grid";localStorage.setItem("qd_view","grid");render()};
$("sort").onchange=function(){state.sort=this.value;state.dir=state.sort==="name"||state.sort==="type"?1:-1;localStorage.setItem("qd_sort",state.sort);render()};
$("menuBtn").onclick=function(){$("side").classList.add("open");$("scrim").classList.add("open")};
$("scrim").onclick=closeSide;
var qt;$("q").addEventListener("input",function(){var v=this.value.trim();$("qClear").style.display=v?"block":"none";clearTimeout(qt);qt=setTimeout(function(){state.q=v;render()},120)});
$("qClear").onclick=function(e){e.preventDefault();$("q").value="";this.style.display="none";state.q="";render();$("q").focus()};
document.addEventListener("keydown",function(e){
  if($("ov").classList.contains("open")){if(e.key==="Escape")closePv();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1);return}
  if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus()}
});

function start(){
  build();
  var h=decodeURIComponent((location.hash||"").slice(1)),fkey=null,qi=h.indexOf("?f=");
  if(qi>=0){fkey=decodeURIComponent(h.slice(qi+3));h=h.slice(0,qi)}
  if(h==="~recent"){state.mode="recent"}else if(h&&nodeAt(h)){go(h)}
  if(state.sort==="time"||state.sort==="size")state.dir=-1;
  render();
  if(fkey){var i=shown.findIndex(function(f){return f.key===fkey});if(i>=0)preview(i)}
}
if(M&&M.files)start();
else fetch("manifest.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){M=j;start()}).catch(function(){$("content").innerHTML='<div class="empty">文件清单加载失败，请稍后刷新。</div>'});
})();
</script>
</body>
</html>
