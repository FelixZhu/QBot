<style>
@font-face{font-family:"Microsoft YaHei";src:url("fonts/msyh-subset.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Microsoft YaHei";src:url("fonts/msyhbd-subset.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"微软雅黑";src:url("fonts/msyh-subset.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"微软雅黑";src:url("fonts/msyhbd-subset.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --d-accent:#A94E27;--accent-2:#D9774B;--d-accent-soft:rgba(217,119,75,.12);
  --d-bg:#FAF8F3;--bg-side:#F3EFE7;--bg-2:#ECE7DD;--bg-pane:#FAF8F3;--d-line:#E3DDD1;--text:#1C1B19;--muted:#736D62;--hover:rgba(28,27,25,.05);
  --pdf-bg:#E6E1D7;--shadow:0 16px 48px rgba(28,27,25,.16);
  --d-font:"Microsoft YaHei","微软雅黑","PingFang SC","Noto Sans SC","HarmonyOS Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --side-w:320px;--info-w:280px;
}
[data-theme="dark"]{
  --d-accent:#E58A5E;--accent-2:#E58A5E;--d-accent-soft:rgba(229,138,94,.16);
  --d-bg:#1F1D1A;--bg-side:#171614;--bg-2:#2E2B27;--bg-pane:#1F1D1A;--d-line:#34312C;--text:#EDE8DF;--muted:#9A9386;--hover:rgba(243,239,231,.06);
  --pdf-bg:#131210;--shadow:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--d-font);color:var(--text);background:var(--d-bg);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
.app{display:flex;height:100vh;height:100dvh}
/* ---------- sidebar ---------- */
.side{width:var(--side-w);flex:none;background:var(--bg-side);border-right:1px solid var(--d-line);display:flex;flex-direction:column;min-height:0;transition:margin .2s}
.app.side-collapsed .side{margin-left:calc(-1 * var(--side-w))}
.side-head{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;flex:1;min-width:0}
.logo{width:26px;height:26px;display:grid;place-items:center}
.ib{width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--d-accent)}
.side-search{margin:0 10px 8px;display:flex;align-items:center;gap:8px;height:37px;padding:0 10px;border-radius:8px;background:var(--bg-2);color:var(--muted);font-size:15px;cursor:pointer;border:1px solid transparent}
.side-search:hover{border-color:var(--d-line)}
.side-search kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--d-line);background:var(--d-bg);color:var(--muted)}
.tree{flex:1;overflow:auto;padding:2px 6px 16px;overscroll-behavior:contain;font-size:16px}
.sec{display:flex;align-items:center;font-size:13px;letter-spacing:.4px;color:var(--muted);padding:14px 8px 5px;font-weight:700}
.sec .grow{flex:1}
.ti{display:flex;align-items:center;gap:6px;height:32px;padding-right:8px;border-radius:6px;cursor:pointer;color:var(--text);opacity:.88;white-space:nowrap;user-select:none;position:relative}
.ti:hover{background:var(--hover);opacity:1}
.ti.active{background:var(--d-accent-soft);color:var(--d-accent);opacity:1;font-weight:700}
.ti .tw{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.ti .tw.open{transform:rotate(90deg)}
.ti .tw.none{visibility:hidden}
.ti .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.ti .cnt{font-size:13px;color:var(--muted);font-weight:400}
.ti .fic{width:18px;height:18px}
.kids{position:relative}
.kids::before{content:"";position:absolute;top:0;bottom:0;border-left:1px solid var(--d-line);left:var(--g)}
.kids.closed{display:none}
.side-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--d-line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-pane)}
.tabbar{display:flex;align-items:flex-end;gap:2px;height:42px;padding:6px 6px 0;background:var(--bg-side);border-bottom:1px solid var(--d-line);flex:none;padding-top:calc(6px + env(safe-area-inset-top))}
.tabbar .ib{margin-bottom:5px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;align-items:flex-end;height:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;min-width:110px;max-width:220px;border-radius:8px 8px 0 0;color:var(--muted);cursor:pointer;flex:none;position:relative;font-size:13px}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.active{background:var(--bg-pane);color:var(--text);box-shadow:0 0 0 1px var(--d-line);clip-path:inset(-2px -2px 0 -2px)}
.tab .tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.55}
.tab .x:hover{background:var(--hover);opacity:1}
.tab .fic{width:15px;height:15px}
.viewhead{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 14px;border-bottom:1px solid var(--d-line);flex:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap}
.crumbs a{padding:3px 5px;border-radius:5px;cursor:pointer;flex:none}
.crumbs a:hover{background:var(--hover);color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:700;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:3px 5px}
.crumbs .sep{opacity:.5;flex:none}
.body{flex:1;display:flex;min-height:0}
.pane{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.info{width:var(--info-w);flex:none;border-left:1px solid var(--d-line);background:var(--bg-side);overflow:auto;padding:18px 16px;display:none}
.app.info-open .info{display:block}
.info h4{margin:0 0 12px;font-size:12px;color:var(--muted);letter-spacing:.4px}
.info .big{display:grid;place-items:center;padding:18px 0 14px}
.info .big .fic{width:64px;height:64px}
.info .fname{font-weight:700;word-break:break-all;line-height:1.5;margin-bottom:14px;text-align:center}
.kv{display:grid;grid-template-columns:72px 1fr;gap:9px 8px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:36px;border-radius:8px;border:1px solid var(--d-line);background:var(--d-bg);font-size:13px;margin-bottom:8px}
.btn:hover{border-color:var(--d-accent);color:var(--d-accent)}
.btn.primary{background:var(--d-accent);border-color:var(--d-accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);color:#fff}
/* ---------- viewers ---------- */
.scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.center{display:flex;align-items:center;justify-content:center;flex:1;padding:20px;min-height:0}
.center img,.center video{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow);background:#000}
.audio-card{width:min(520px,100%);text-align:center;padding:36px 28px;border-radius:16px;background:var(--bg-2);border:1px solid var(--d-line)}
.audio-card .fic{width:72px;height:72px;margin-bottom:12px}
.audio-card audio{width:100%;margin-top:18px}
.md{max-width:820px;margin:0 auto;padding:32px 36px 80px;line-height:1.8;font-size:15px}
.md pre{background:var(--bg-2);padding:14px 16px;border-radius:8px;overflow:auto;font-size:13px}
.md code{font-family:var(--mono);font-size:.9em}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--d-line);padding:6px 10px}
.md img{max-width:100%}
.md a{color:var(--d-accent)}
pre.code{margin:0;padding:24px 28px 80px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
pre.code .hljs{background:none;padding:0}
/* pdf */
.pdfbar{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-bottom:1px solid var(--d-line);flex:none;font-size:13px;color:var(--muted);background:var(--bg-pane)}
.pdfbar .grow{flex:1}
.pdfbar input{width:46px;height:26px;border:1px solid var(--d-line);border-radius:6px;background:var(--d-bg);color:var(--text);text-align:center;font:inherit}
.pdfbar .z{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.pdfwrap{flex:1;overflow:auto;background:var(--pdf-bg);padding:16px 0 60px;-webkit-overflow-scrolling:touch}
.pg{margin:0 auto 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative}
.pg canvas{display:block;width:100%;height:100%}
.pg .pn{position:absolute;right:-2px;bottom:-20px;font-size:11px;color:var(--muted)}
.pdf-native{flex:1;border:0;width:100%;background:var(--pdf-bg)}
.notice{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--muted);background:var(--bg-2);border-bottom:1px solid var(--d-line);flex:none}
.notice a{color:var(--d-accent);font-weight:700;margin-left:auto;white-space:nowrap}
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--d-line);border-top-color:var(--d-accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* folder / home view */
.home{max-width:980px;margin:0 auto;padding:28px 28px 80px}
.home h1{font-size:24px;margin:6px 0 4px}
.home .sub{color:var(--muted);margin-bottom:24px;font-size:13px}
.home h3{font-size:13px;color:var(--muted);margin:26px 0 10px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--d-line);cursor:pointer;min-width:0;background:var(--d-bg)}
.card:hover{border-color:var(--d-accent);background:var(--d-accent-soft)}
.card .fic{width:30px;height:30px}
.card .t{min-width:0;flex:1}
.card .n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{border:1px solid var(--d-line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--d-line);cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .fic{width:22px;height:22px}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--muted);font-size:12px;white-space:nowrap}
/* quick switcher */
.qs-ov{position:fixed;inset:0;background:rgba(10,8,20,.4);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.qs-ov.open{display:flex}
.qs{width:min(640px,calc(100% - 24px));background:var(--d-bg);border:1px solid var(--d-line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.qs input{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:16px 18px;border-bottom:1px solid var(--d-line)}
.qs-list{max-height:min(420px,55vh);overflow:auto;padding:6px}
.qi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.qi.sel{background:var(--d-accent-soft)}
.qi .fic{width:18px;height:18px}
.qi .t{min-width:0;flex:1}
.qi .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .n b{color:var(--d-accent)}
.qi .p{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--d-line);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#222;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:all .2s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.scrim{display:none}
.only-m{display:none}
/* ---------- narrow / folded phone (Honor inner screen is typically 700-900px) ---------- */
@media (max-width:599px){
  .only-m{display:inline-grid}
  .hide-m{display:none!important}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;transform:translateX(-102%);transition:transform .22s;margin:0!important}
  .app.drawer .side{transform:none;box-shadow:var(--shadow)}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .tab{min-width:90px;max-width:160px}
  .crumbs a,.crumbs .sep{display:none}
  .viewhead{padding-left:10px}
  .info{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:70vh;border-left:0;border-top:1px solid var(--d-line);border-radius:16px 16px 0 0;z-index:45;box-shadow:var(--shadow);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .app.info-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:44}
  .home{padding:20px 14px 60px}
  .home-narrow h1{font-size:22px;margin:4px 0 2px}
  .home-narrow .sub{margin-bottom:16px}
  .cards{grid-template-columns:1fr}
  .center{padding:8px}
  .md{padding:20px 18px 60px}
  pre.code{padding:16px}
  .pdfwrap{padding:8px 0 40px}
  .pg{margin-bottom:8px}
  .pdfbar .hide-s{display:none}
}
/* ================= QBot shell: bottom tabs (folded) / 72px rail (unfolded) =================
 * Design: BRAND.md §8.1. Colors/sizes come from tokens.css (loaded globally, single copy in
 * apps/drive-web/). The drive's own colliding variables were renamed --d-* so the two never clash. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.qbs{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "nav";
  overflow:hidden;overscroll-behavior:none;height:100%;height:100dvh}
.qbs-panel{grid-area:main;min-width:0;min-height:0;height:100%;position:relative;overflow:hidden;overscroll-behavior:contain}
/* Keep inactive tabs laid out (not display:none) so feed/kb can measure a definite height and scroll is preserved. */
.qbs-panel[hidden]{display:block!important;visibility:hidden;pointer-events:none;z-index:0}
.qbs-panel:not([hidden]){z-index:1}
.qbs-panel[hidden]{display:none}
#panel-kb>.app{height:100%}
#tab-kb[hidden],#panel-kb>.app[hidden]{display:none}
#btnKbBack{display:none}
#panel-kb.kb-viewing #btnKbBack{display:inline-grid}
/* With the kb module, the old drive is only the file previewer behind kb:open: no sidebar, no tab strip. */
#panel-kb.kb-pending>.app{visibility:hidden}
#panel-kb.kb-mode .side,#panel-kb.kb-mode .scrim,#panel-kb.kb-mode #tabs,#panel-kb.kb-mode #btnSide,
#panel-kb.kb-mode #btnRefresh,#panel-kb.kb-mode #btnQsM,#panel-kb.kb-mode #btnNewTab{display:none!important}
@media (min-width:600px){#panel-kb.kb-mode .tabbar{display:none}}
.qbs-nav{grid-area:nav;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;font-family:var(--font)}
/* Soft keyboard: hide the tab bar so the composer can use the 56px (folded) / 72px (unfolded). */
.qbs.is-kbd{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);grid-template-areas:"main"}
.qbs.is-kbd .qbs-nav{display:none}
.qbs-brand{display:none}
.qbs-item{flex:1;position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;line-height:16px;color:var(--text-3);-webkit-tap-highlight-color:transparent}
.qbs-item:active{background:var(--fill)}
@media (hover:hover){.qbs-item:hover{background:var(--fill-hover);color:var(--text-1)}}
.qbs-item svg{width:24px;height:24px}
.qbs-item>span{white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;line-height:16px}
.qbs-item>*{flex:none}
.qbs-item[aria-current="page"]{color:var(--text-1);font-weight:700}
.qbs-item .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.qbs-item .dot[hidden]{display:none}
.qbs-item:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
#tab-feed,#tab-kb{height:100%;min-height:0;overflow:hidden;background:var(--surface);color:var(--text-1);font-family:var(--font)}
#panel-feed,#panel-kb,#panel-chat,#chat-root{height:100%;min-height:0}
.qbs-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
.qbs-empty svg{width:48px;height:48px;opacity:.35;margin-bottom:8px}
.qbs-empty b{font-size:17px;line-height:24px}
.qbs-empty span{font-size:14px;line-height:22px;color:var(--text-3);max-width:280px}
@media (min-width:600px){
  .qbs{grid-template-rows:none;grid-template-columns:72px minmax(0,1fr);grid-template-areas:"nav main"}
  .qbs-nav{flex-direction:column;align-items:center;gap:4px;border-top:0;border-right:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom));overflow:hidden}
  .qbs-brand{display:grid;place-items:center;width:44px;height:44px;margin-bottom:12px}
  .qbs-brand svg{width:30px;height:30px}
  .qbs-item{flex:none;width:60px;height:60px;border-radius:14px;font-size:11px}
  .qbs-item[aria-current="page"]{background:var(--fill)}
  .qbs-item .dot{top:8px;left:auto;right:12px}
}
/* drive inside the shell, folded: one merged 52px top bar, 44px targets, toast above the tab bar */
@media (max-width:599px){
  .toast{bottom:calc(28px + 56px + env(safe-area-inset-bottom))}
  .main{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-rows:52px minmax(0,1fr);align-items:center;
    padding-top:env(safe-area-inset-top);border-bottom:0}
  .main>.tabbar,.main>.viewhead{display:contents}
  #tabs,#btnRefresh,#btnNewTab,#btnCopy{display:none!important}
  .main .tabbar .ib{margin:0}
  #btnKbBack{grid-column:1;grid-row:1;margin-left:4px}
  #btnSide{grid-column:1;grid-row:1;margin-left:4px!important}
  #panel-kb.kb-viewing #btnSide{display:none}
  .main .crumbs{grid-column:2;grid-row:1;padding:0 4px;font-size:17px}

var qsSel=0,qsRes=[];
function fuzzy(q,s){q=q.toLowerCase();var t=s.toLowerCase(),i=0,j=0,score=0,last=-2,hits=[];
  var sub=t.indexOf(q);if(sub>=0){for(var k=0;k<q.length;k++)hits.push(sub+k);return{s:1000-sub-(t.length/100),h:hits}}
  for(;i<q.length;i++){if(q[i]===" ")continue;var f=t.indexOf(q[i],j);if(f<0)return null;score+=f===last+1?8:1;if(f===0||/[\/_\-. ]/.test(t[f-1]))score+=5;hits.push(f);last=f;j=f+1}return{s:score-(t.length/100),h:hits}}

  else{qsRes=[];files.forEach(function(f){var a=fuzzy(q,f.name),b=fuzzy(q,f.key);var r=a&&(!b||a.s+50>=b.s)?{f:f,s:a.s+50,h:a.h}:b?{f:f,s:b.s,h:[]}:null;if(r)qsRes.push(r)});qsRes.sort(function(a,b){return b.s-a.s});qsRes=qsRes.slice(0,50)}

  if((el=t.closest(".ti[data-key]"))){openItem(el.dataset.key);return}
  if(t.closest(".ti[data-home]")){openItem("~home");return}
  if((el=t.closest("[data-crumb]"))){var c=el.dataset.crumb;openItem(c?"dir:"+c:"dir:",{replace:true});return}
  if((el=t.closest("[data-open]"))){openItem(el.dataset.open);return}
  if((el=t.closest("[data-opendir]"))){openItem("dir:"+el.dataset.opendir,{replace:true});return}
  if(t.closest("[data-copylink]")){var f=curFile();f&&copy(url(f),"直链已复制");return}
  if(t.closest("[data-copypage]")){copy(location.href,"页面链接已复制");return}
});
document.addEventListener("auxclick",function(e){var el=e.target.closest("[data-tab]");if(e.button===1&&el){e.preventDefault();closeTab(el.dataset.tab)}});
document.addEventListener("keydown",function(e){var mod=e.ctrlKey||e.metaKey;
  if(mod&&(e.key==="k"||e.key==="K"||e.key==="o"||e.key==="O"||e.key==="p"||e.key==="P")){e.preventDefault();$("qsOv").classList.contains("open")?qsClose():qsOpen();return}
  if(e.key==="Escape"){qbotBack();return}
  if(mod&&(e.key==="w"||e.key==="W")&&S.active&&S.tabs.length){e.preventDefault();closeTab(S.active);return}
  if(e.altKey&&(e.key==="ArrowRight"||e.key==="ArrowLeft")&&S.tabs.length>1){var i=S.tabs.indexOf(S.active);openItem(S.tabs[(i+(e.key==="ArrowRight"?1:-1)+S.tabs.length)%S.tabs.length]);e.preventDefault()}
});
function closeInfo(){
  if(!S.info&&!$("app").classList.contains("info-open"))return false;
  S.info=false;$("app").classList.remove("info-open");save();renderCrumbs();return true;
}
function restoreHistory(){
  ignorePop++;
  history.pushState({qbot:leftHome?"away":"home"},"",location.pathname+location.search+location.hash);
}
function qbotBack(opts){
  opts=opts||{};
  if($("qsOv").classList.contains("open")){qsClose();if(opts.fromPop)restoreHistory();return true}
  if(S.info||$("app").classList.contains("info-open")){closeInfo();if(opts.fromPop)restoreHistory();return true}
  if(isMobile()&&$("app").classList.contains("drawer")){closeDrawer();if(opts.fromPop)restoreHistory();return true}
  if(!isHome()){
    if(opts.fromPop){leftHome=false;openItem("~home",{noHash:true})}
    else openItem("~home");
    return true;
  }
  return false;
}
window.qbotBack=qbotBack;
window.qbotDriveOpen=function(key){if(byKey[key])openItem(key)};
window.addEventListener("hashchange",function(){var id=fromHash();if(id&&id!==S.active)openItem(id,{noHash:true})});
window.addEventListener("popstate",function(){
  if(ignorePop){ignorePop--;return}
  qbotBack({fromPop:true});
});
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("show")},1600)}
function copy(t,msg){(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast(msg||"已复制")}).catch(function(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(msg||"已复制")}catch(e){prompt("复制链接",t)}a.remove()})}

/* ---------- refresh / version ---------- */
function hardReload(){
  var path=location.pathname||"/";
  location.replace(path+"?v="+Date.now()+location.hash);
}
function checkVersion(){
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(v){
    if(v&&v.version&&PAGE_VERSION&&v.version!==PAGE_VERSION)hardReload();
  }).catch(function(){});
}
$("btnRefresh").onclick=function(){hardReload()};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")checkVersion()});
checkVersion();

/* ---------- boot ---------- */
var initial=fromHash();
if(initial)openItem(initial,{noHash:true});
else if(S.active&&(S.active==="~home"||S.active.indexOf("dir:")===0||byKey[S.active]))openItem(S.active);
else openItem("~home");
armAway();
})();
</script>
<script src="shell-media.js?v=__VERSION__"></script>
<script>
/* QBot shell: tab switching, optional modules, and the Android back order (BRAND §8.1):
 * close overlays/drawer → current tab's home → 对话 tab → false (native shows the exit hint). */
(function(){
  var TABS=["chat","feed","kb"],cur=window.__qbTab||"chat",V="__VERSION__";
  var kbPanel=document.getElementById("panel-kb"),kbEl=document.getElementById("tab-kb"),app=document.getElementById("app");
  kbPanel.hidden=cur!=="kb";
  if(cur!=="kb")kbPanel.setAttribute("inert","");
  /* Keep the shell inside the visual viewport so the composer stays visible above the soft keyboard. */
  function fitViewport(){
    var el=document.getElementById("qbs"),vv=window.visualViewport;
    if(!el)return;
    if(!vv){el.style.top=el.style.left=el.style.width=el.style.height="";el.classList.remove("is-kbd");return}
    el.style.top=vv.offsetTop+"px";
    el.style.left=vv.offsetLeft+"px";
    el.style.width=vv.width+"px";
    el.style.height=vv.height+"px";
    el.style.right="auto";
    el.style.bottom="auto";
    /* Hide the bottom tab bar (and the unfolded rail) when the soft keyboard is open. */
    if(vv.height<window.innerHeight*0.75)el.classList.add("is-kbd");
    else el.classList.remove("is-kbd");
  }
  if(window.visualViewport){
    visualViewport.addEventListener("resize",fitViewport);
    visualViewport.addEventListener("scroll",fitViewport);
  }
  fitViewport();
  var driveBack=window.qbotBack,kbMode=false;
  function syncPanel(n,on){
    var p=document.getElementById("panel-"+n);
    p.hidden=!on;
    if(on)p.removeAttribute("inert");else p.setAttribute("inert","");
  }
  function setTab(t){
    if(TABS.indexOf(t)<0||t===cur)return;
    cur=t;
    TABS.forEach(function(n){syncPanel(n,n===t)});
    document.querySelectorAll(".qbs-item").forEach(function(b){if(b.dataset.qbsTab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
    try{sessionStorage.setItem("qbs_tab",t)}catch(e){}
    /* Every tab: feed (and kb) mount while hidden, so they need a resize once the panel has a definite height. */
    window.dispatchEvent(new Event("resize"));
    window.dispatchEvent(new CustomEvent("qbot:tab",{detail:{tab:t}}));
  }
  /* 知识库: kb.js (knowledge-base engineer) shows the list; files open in the existing drive viewer. */
  function showViewer(on){
    kbPanel.classList.toggle("kb-viewing",on);
    kbEl.hidden=on;app.hidden=!on;
    if(on)window.dispatchEvent(new Event("resize"));
  }
  kbEl.addEventListener("kb:open",function(e){
    var f=e.detail||{},key=f.key||f.path;
    if(!key||!window.qbotDriveOpen)return;
    showViewer(true);window.qbotDriveOpen(key);
  });
  document.getElementById("btnKbBack").addEventListener("click",function(){showViewer(false)});
  document.getElementById("qbsNav").addEventListener("click",function(e){var b=e.target.closest(".qbs-item");if(!b)return;if(b.dataset.qbsTab===cur&&cur==="kb"&&kbMode)showViewer(false);setTab(b.dataset.qbsTab)});
  window.qbotTab=setTab;
  window.qbotCurrentTab=function(){return cur};
  window.qbotSetFeedUnread=function(on){document.getElementById("qbsFeedDot").hidden=!on};
  /* Old Android shells only inspect .scroller for pull-to-refresh; mark tab scrollers so down-swipes are not stolen. */
  function markScrollers(){
    document.querySelectorAll(".q-feed,.qc-viewport,#kb-main-scroll").forEach(function(el){el.classList.add("scroller")});
  }
  window.addEventListener("qbot:tab",markScrollers);
  var qbsHost=document.getElementById("qbs");
  if(qbsHost&&window.MutationObserver)new MutationObserver(markScrollers).observe(qbsHost,{childList:true,subtree:true});
  markScrollers();
  function restoreShellHistory(){
    try{history.pushState({qbot:"shell"},"",location.pathname+location.search+location.hash)}catch(e){}
  }
  window.qbotBack=function(opts){
    opts=opts||{};
    /* Article / video overlay sits above the feed. Closing it must not move the card. */
    if(window.qbotShell&&qbotShell.isOpen()){
      qbotShell.close();
      if(opts.fromPop)restoreShellHistory();
      return true;
    }
    var handled=false;
    if(cur==="kb"){
      if(kbMode&&!kbPanel.classList.contains("kb-viewing")){
        if(window.qbotKb&&typeof window.qbotKb.back==="function"&&window.qbotKb.back())handled=true;
      }else if(kbMode){
        /* viewer opened from the kb list: close drive overlays first, then straight back to the list */
        var ov=document.getElementById("qsOv").classList.contains("open")||app.classList.contains("info-open")||app.classList.contains("drawer");
        if(ov&&driveBack&&driveBack(opts))handled=true;
        else{showViewer(false);handled=true}
      }else{
        if(driveBack&&driveBack(opts))handled=true;
        else if(opts&&opts.fromPop)handled=false;
        else{setTab("chat");handled=true}
      }
      if(!handled){setTab("chat");handled=true}
    }else if(cur==="chat"){
      handled=!!(window.qbotChat&&window.qbotChat.back());
    }else if(cur==="feed"){
      /* true = feed handled (sheet or not first card); false = already on first card, go to 对话 */
      if(window.qbotFeed&&typeof window.qbotFeed.back==="function"&&window.qbotFeed.back())handled=true;
      else{setTab("chat");handled=true}
    }else{
      setTab("chat");handled=true;
    }
    if(handled&&opts.fromPop)restoreShellHistory();
    return handled;
  };
  if(window.QbotShellMedia&&QbotShellMedia.mount)QbotShellMedia.mount({host:document.getElementById("qbs")});
  /* Optional standalone modules: load only if they were published next to index.html. */
  function exists(u){return fetch(u,{method:"HEAD",cache:"no-store"}).then(function(r){return r.ok}).catch(function(){return false})}
  function css(u){var l=document.createElement("link");l.rel="stylesheet";l.href=u+"?v="+V;document.head.appendChild(l)}
  function js(u,cb){var s=document.createElement("script");s.src=u+"?v="+V;if(cb)s.onload=cb;document.body.appendChild(s)}
  exists("feed.css").then(function(ok){if(ok)css("feed.css")});
  /* 主动服务: feed.js exposes QbotFeed.mount(el,{feedUrl}); reads the site copy out/feed.json (feed.js only falls back from OSS on localhost); switch to OSS once feed/feed.json is uploaded. */
  exists("feed.js").then(function(ok){if(ok)js("feed.js",function(){
    if(window.QbotFeed&&QbotFeed.mount)QbotFeed.mount(document.getElementById("tab-feed"),{feedUrl:"out/feed.json"});
    markScrollers();
  })});
  Promise.all([exists("kb.js"),exists("kb.css")]).then(function(r){
    if(!r[0]){kbPanel.classList.remove("kb-pending");return}  /* fallback: the existing drive UI stays as the 知识库 tab */
    if(r[1])css("kb.css");
    js("kb.js",function(){
      kbMode=true;
      kbPanel.classList.add("kb-mode");kbPanel.classList.remove("kb-pending");
      var vh=app.querySelector(".viewhead"),bb=document.getElementById("btnKbBack");vh.insertBefore(bb,vh.firstChild);
      var h=window.__qbHash||"";
      showViewer(h.indexOf("#/")===0&&h!=="#/"&&h.indexOf("#/~home")!==0);
      markScrollers();
    });
  });
})();
</script>
