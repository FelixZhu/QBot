<style>
@font-face{font-family:"Microsoft YaHei";src:url("fonts/msyh-subset.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Microsoft YaHei";src:url("fonts/msyhbd-subset.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"微软雅黑";src:url("fonts/msyh-subset.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"微软雅黑";src:url("fonts/msyhbd-subset.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --d-accent:#A94E27;--accent-2:#D9774B;--d-accent-soft:rgba(217,119,75,.12);
  --d-bg:#FAF8F3;--bg-side:#F3EFE7;--bg-2:#ECE7DD;--bg-pane:#FAF8F3;--d-line:#E3DDD1;--text:#1C1B19;--muted:#736D62;--hover:rgba(28,27,25,.05);
  --pdf-bg:#E6E1D7;--shadow:0 16px 48px rgba(28,27,25,.16);
  --d-font:"Microsoft YaHei","微软雅黑","PingFang SC","Noto Sans SC","HarmonyOS Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --side-w:320px;--info-w:280px;
}
[data-theme="dark"]{
  --d-accent:#E58A5E;--accent-2:#E58A5E;--d-accent-soft:rgba(229,138,94,.16);
  --d-bg:#1F1D1A;--bg-side:#171614;--bg-2:#2E2B27;--bg-pane:#1F1D1A;--d-line:#34312C;--text:#EDE8DF;--muted:#9A9386;--hover:rgba(243,239,231,.06);
  --pdf-bg:#131210;--shadow:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--d-font);color:var(--text);background:var(--d-bg);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
.app{display:flex;height:100vh;height:100dvh}
/* ---------- sidebar ---------- */
.side{width:var(--side-w);flex:none;background:var(--bg-side);border-right:1px solid var(--d-line);display:flex;flex-direction:column;min-height:0;transition:margin .2s}
.app.side-collapsed .side{margin-left:calc(-1 * var(--side-w))}
.side-head{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;flex:1;min-width:0}
.logo{width:26px;height:26px;display:grid;place-items:center}
.ib{width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--d-accent)}
.side-search{margin:0 10px 8px;display:flex;align-items:center;gap:8px;height:37px;padding:0 10px;border-radius:8px;background:var(--bg-2);color:var(--muted);font-size:15px;cursor:pointer;border:1px solid transparent}
.side-search:hover{border-color:var(--d-line)}
.side-search kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--d-line);background:var(--d-bg);color:var(--muted)}
.tree{flex:1;overflow:auto;padding:2px 6px 16px;overscroll-behavior:contain;font-size:16px}
.sec{display:flex;align-items:center;font-size:13px;letter-spacing:.4px;color:var(--muted);padding:14px 8px 5px;font-weight:700}
.sec .grow{flex:1}
.ti{display:flex;align-items:center;gap:6px;height:32px;padding-right:8px;border-radius:6px;cursor:pointer;color:var(--text);opacity:.88;white-space:nowrap;user-select:none;position:relative}
.ti:hover{background:var(--hover);opacity:1}
.ti.active{background:var(--d-accent-soft);color:var(--d-accent);opacity:1;font-weight:700}
.ti .tw{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.ti .tw.open{transform:rotate(90deg)}
.ti .tw.none{visibility:hidden}
.ti .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.ti .cnt{font-size:13px;color:var(--muted);font-weight:400}
.ti .fic{width:18px;height:18px}
.kids{position:relative}
.kids::before{content:"";position:absolute;top:0;bottom:0;border-left:1px solid var(--d-line);left:var(--g)}
.kids.closed{display:none}
.side-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--d-line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-pane)}
.tabbar{display:flex;align-items:flex-end;gap:2px;height:42px;padding:6px 6px 0;background:var(--bg-side);border-bottom:1px solid var(--d-line);flex:none;padding-top:calc(6px + env(safe-area-inset-top))}
.tabbar .ib{margin-bottom:5px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;align-items:flex-end;height:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;min-width:110px;max-width:220px;border-radius:8px 8px 0 0;color:var(--muted);cursor:pointer;flex:none;position:relative;font-size:13px}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.active{background:var(--bg-pane);color:var(--text);box-shadow:0 0 0 1px var(--d-line);clip-path:inset(-2px -2px 0 -2px)}
.tab .tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.55}
.tab .x:hover{background:var(--hover);opacity:1}
.tab .fic{width:15px;height:15px}
.viewhead{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 14px;border-bottom:1px solid var(--d-line);flex:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap}
.crumbs a{padding:3px 5px;border-radius:5px;cursor:pointer;flex:none}
.crumbs a:hover{background:var(--hover);color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:700;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:3px 5px}
.crumbs .sep{opacity:.5;flex:none}
.body{flex:1;display:flex;min-height:0}
.pane{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.info{width:var(--info-w);flex:none;border-left:1px solid var(--d-line);background:var(--bg-side);overflow:auto;padding:18px 16px;display:none}
.app.info-open .info{display:block}
.info h4{margin:0 0 12px;font-size:12px;color:var(--muted);letter-spacing:.4px}
.info .big{display:grid;place-items:center;padding:18px 0 14px}
.info .big .fic{width:64px;height:64px}
.info .fname{font-weight:700;word-break:break-all;line-height:1.5;margin-bottom:14px;text-align:center}
.kv{display:grid;grid-template-columns:72px 1fr;gap:9px 8px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:36px;border-radius:8px;border:1px solid var(--d-line);background:var(--d-bg);font-size:13px;margin-bottom:8px}
.btn:hover{border-color:var(--d-accent);color:var(--d-accent)}
.btn.primary{background:var(--d-accent);border-color:var(--d-accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);color:#fff}
/* ---------- viewers ---------- */
.scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.center{display:flex;align-items:center;justify-content:center;flex:1;padding:20px;min-height:0}
.center img,.center video{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow);background:#000}
.audio-card{width:min(520px,100%);text-align:center;padding:36px 28px;border-radius:16px;background:var(--bg-2);border:1px solid var(--d-line)}
.audio-card .fic{width:72px;height:72px;margin-bottom:12px}
.audio-card audio{width:100%;margin-top:18px}
.md{max-width:820px;margin:0 auto;padding:32px 36px 80px;line-height:1.8;font-size:15px}
.md pre{background:var(--bg-2);padding:14px 16px;border-radius:8px;overflow:auto;font-size:13px}
.md code{font-family:var(--mono);font-size:.9em}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--d-line);padding:6px 10px}
.md img{max-width:100%}
.md a{color:var(--d-accent)}
pre.code{margin:0;padding:24px 28px 80px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
pre.code .hljs{background:none;padding:0}
/* pdf */
.pdfbar{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-bottom:1px solid var(--d-line);flex:none;font-size:13px;color:var(--muted);background:var(--bg-pane)}
.pdfbar .grow{flex:1}
.pdfbar input{width:46px;height:26px;border:1px solid var(--d-line);border-radius:6px;background:var(--d-bg);color:var(--text);text-align:center;font:inherit}
.pdfbar .z{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.pdfwrap{flex:1;overflow:auto;background:var(--pdf-bg);padding:16px 0 60px;-webkit-overflow-scrolling:touch}
.pg{margin:0 auto 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative}
.pg canvas{display:block;width:100%;height:100%}
.pg .pn{position:absolute;right:-2px;bottom:-20px;font-size:11px;color:var(--muted)}
.pdf-native{flex:1;border:0;width:100%;background:var(--pdf-bg)}
.notice{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--muted);background:var(--bg-2);border-bottom:1px solid var(--d-line);flex:none}
.notice a{color:var(--d-accent);font-weight:700;margin-left:auto;white-space:nowrap}
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--d-line);border-top-color:var(--d-accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* folder / home view */
.home{max-width:980px;margin:0 auto;padding:28px 28px 80px}
.home h1{font-size:24px;margin:6px 0 4px}
.home .sub{color:var(--muted);margin-bottom:24px;font-size:13px}
.home h3{font-size:13px;color:var(--muted);margin:26px 0 10px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--d-line);cursor:pointer;min-width:0;background:var(--d-bg)}
.card:hover{border-color:var(--d-accent);background:var(--d-accent-soft)}
.card .fic{width:30px;height:30px}
.card .t{min-width:0;flex:1}
.card .n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{border:1px solid var(--d-line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--d-line);cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .fic{width:22px;height:22px}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--muted);font-size:12px;white-space:nowrap}
/* quick switcher */
.qs-ov{position:fixed;inset:0;background:rgba(10,8,20,.4);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.qs-ov.open{display:flex}
.qs{width:min(640px,calc(100% - 24px));background:var(--d-bg);border:1px solid var(--d-line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.qs input{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:16px 18px;border-bottom:1px solid var(--d-line)}
.qs-list{max-height:min(420px,55vh);overflow:auto;padding:6px}
.qi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.qi.sel{background:var(--d-accent-soft)}
.qi .fic{width:18px;height:18px}
.qi .t{min-width:0;flex:1}
.qi .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .n b{color:var(--d-accent)}
.qi .p{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--d-line);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#222;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:all .2s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.scrim{display:none}
.only-m{display:none}
/* ---------- narrow / folded phone (Honor inner screen is typically 700-900px) ---------- */
@media (max-width:599px){
  .only-m{display:inline-grid}
  .hide-m{display:none!important}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;transform:translateX(-102%);transition:transform .22s;margin:0!important}
  .app.drawer .side{transform:none;box-shadow:var(--shadow)}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .tab{min-width:90px;max-width:160px}
  .crumbs a,.crumbs .sep{display:none}
  .viewhead{padding-left:10px}
  .info{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:70vh;border-left:0;border-top:1px solid var(--d-line);border-radius:16px 16px 0 0;z-index:45;box-shadow:var(--shadow);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .app.info-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:44}
  .home{padding:20px 14px 60px}
  .home-narrow h1{font-size:22px;margin:4px 0 2px}
  .home-narrow .sub{margin-bottom:16px}
  .cards{grid-template-columns:1fr}
  .center{padding:8px}
  .md{padding:20px 18px 60px}
  pre.code{padding:16px}
  .pdfwrap{padding:8px 0 40px}
  .pg{margin-bottom:8px}
  .pdfbar .hide-s{display:none}
}
/* ================= QBot shell: bottom tabs (folded) / 72px rail (unfolded) =================
 * Design: BRAND.md §8.1. Colors/sizes come from tokens.css (loaded globally, single copy in
 * apps/drive-web/). The drive's own colliding variables were renamed --d-* so the two never clash. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.qbs{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "nav";
  overflow:hidden;overscroll-behavior:none;height:100%;height:100dvh}
.qbs-panel{grid-area:main;min-width:0;min-height:0;height:100%;position:relative;overflow:hidden;overscroll-behavior:contain}
/* Keep inactive tabs laid out (not display:none) so feed/kb can measure a definite height and scroll is preserved. */
.qbs-panel[hidden]{display:block!important;visibility:hidden;pointer-events:none;z-index:0}
.qbs-panel:not([hidden]){z-index:1}
.qbs-panel[hidden]{display:none}
#panel-kb>.app{height:100%}
#tab-kb[hidden],#panel-kb>.app[hidden]{display:none}
#btnKbBack{display:none}
#panel-kb.kb-viewing #btnKbBack{display:inline-grid}
/* With the kb module, the old drive is only the file previewer behind kb:open: no sidebar, no tab strip. */
#panel-kb.kb-pending>.app{visibility:hidden}
#panel-kb.kb-mode .side,#panel-kb.kb-mode .scrim,#panel-kb.kb-mode #tabs,#panel-kb.kb-mode #btnSide,
#panel-kb.kb-mode #btnRefresh,#panel-kb.kb-mode #btnQsM,#panel-kb.kb-mode #btnNewTab{display:none!important}
@media (min-width:600px){#panel-kb.kb-mode .tabbar{display:none}}
.qbs-nav{grid-area:nav;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;font-family:var(--font)}
/* Soft keyboard: hide the tab bar so the composer can use the 56px (folded) / 72px (unfolded). */
.qbs.is-kbd{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);grid-template-areas:"main"}
.qbs.is-kbd .qbs-nav{display:none}
.qbs-brand{display:none}
.qbs-item{flex:1;position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;line-height:16px;color:var(--text-3);-webkit-tap-highlight-color:transparent}
.qbs-item:active{background:var(--fill)}
@media (hover:hover){.qbs-item:hover{background:var(--fill-hover);color:var(--text-1)}}
.qbs-item svg{width:24px;height:24px}
.qbs-item>span{white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;line-height:16px}
.qbs-item>*{flex:none}
.qbs-item[aria-current="page"]{color:var(--text-1);font-weight:700}
.qbs-item .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.qbs-item .dot[hidden]{display:none}
.qbs-item:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
#tab-feed,#tab-kb{height:100%;min-height:0;overflow:hidden;background:var(--surface);color:var(--text-1);font-family:var(--font)}
#panel-feed,#panel-kb,#panel-chat,#chat-root{height:100%;min-height:0}
.qbs-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
.qbs-empty svg{width:48px;height:48px;opacity:.35;margin-bottom:8px}
.qbs-empty b{font-size:17px;line-height:24px}
.qbs-empty span{font-size:14px;line-height:22px;color:var(--text-3);max-width:280px}
@media (min-width:600px){
  .qbs{grid-template-rows:none;grid-template-columns:72px minmax(0,1fr);grid-template-areas:"nav main"}
  .qbs-nav{flex-direction:column;align-items:center;gap:4px;border-top:0;border-right:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom));overflow:hidden}
  .qbs-brand{display:grid;place-items:center;width:44px;height:44px;margin-bottom:12px}
  .qbs-brand svg{width:30px;height:30px}
  .qbs-item{flex:none;width:60px;height:60px;border-radius:14px;font-size:11px}
  .qbs-item[aria-current="page"]{background:var(--fill)}
  .qbs-item .dot{top:8px;left:auto;right:12px}
}
.qbs-appearance{flex:1;position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:16px;color:var(--text-3);-webkit-tap-highlight-color:transparent}
.qbs-appearance svg{width:24px;height:24px}
.qbs-appearance>span{white-space:nowrap}
.qbs-appearance:active{background:var(--fill)}
.qbs-appearance-pop{position:fixed;z-index:45;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--surface-raised);color:var(--text-1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-3);padding:8px 8px 10px}
.qbs-appearance-pop[hidden]{display:none!important}
.qbs-appearance-title{font-size:13px;font-weight:700;color:var(--text-3);padding:6px 10px 4px}

.qbs-appearance-pop button[aria-checked="true"]{background:var(--fill);font-weight:700}
@media (min-width:600px){.qbs-appearance{margin-top:auto;flex:none;width:60px;height:60px;border-radius:14px}}

/* drive inside the shell, folded: one merged 52px top bar, 44px targets, toast above the tab bar */
@media (max-width:599px){
  .toast{bottom:calc(28px + 56px + env(safe-area-inset-bottom))}
  .main{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-rows:52px minmax(0,1fr);align-items:center;
    padding-top:env(safe-area-inset-top);border-bottom:0}
  .main>.tabbar,.main>.viewhead{display:contents}
  #tabs,#btnRefresh,#btnNewTab,#btnCopy{display:none!important}
  .main .tabbar .ib{margin:0}
  #btnKbBack{grid-column:1;grid-row:1;margin-left:4px}
  #btnSide{grid-column:1;grid-row:1;margin-left:4px!important}
  #panel-kb.kb-viewing #btnSide{display:none}
  .main .crumbs{grid-column:2;grid-row:1;padding:0 4px;font-size:17px}
  .main .crumbs .cur{font-weight:700;color:var(--text)}
  #btnQsM{grid-column:3;grid-row:1}
  #btnInfo{grid-column:4;grid-row:1;margin-right:4px}
  .main>.body{grid-column:1/-1;grid-row:2;min-height:0;height:100%;border-top:1px solid var(--d-line)}
  .ib{width:44px;height:44px;border-radius:10px}
  .ti{height:44px}
  .side-search{height:44px}
}
/* Article / video overlay. Folded (390): full bleed over the tab bar.
   Unfolded (840, min-width 600px): leave the 72px rail. Header is --touch (44px). */
.qbs-overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);color:var(--text-1);font-family:var(--font)}
.qbs-overlay[hidden]{display:none!important}
.qbs-ov-bar{flex:none;height:var(--touch);display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.qbs-ov-bar button{min-width:var(--touch);min-height:var(--touch);padding:0 10px;border-radius:10px;font-weight:700}
.qbs-ov-title{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbs-ov-body{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.qbs-ov-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surface)}
.qbs-ov-video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#000}
.qbs-ov-fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;background:var(--surface);color:var(--text-1)}
.qbs-ov-fail-title{margin:0;font-size:17px;font-weight:700}
.qbs-ov-fail-msg{margin:0;max-width:360px;font-size:14px;line-height:22px;color:var(--text-2)}
.qbs-ov-fail button{min-height:var(--touch);padding:0 16px;border-radius:10px;background:var(--btn-primary-bg);color:var(--btn-primary-fg);font-weight:700}
.qbs-ov-frame[hidden],.qbs-ov-video[hidden],.qbs-ov-fail[hidden],.qbs-ov-note[hidden],.qbs-ov-bar button[hidden]{display:none!important}
.qbs-ov-note{flex:none;margin:0;padding:8px 12px;font-size:12px;line-height:16px;color:var(--text-2);background:var(--bg)}
@media (min-width:600px){
  .qbs-overlay{left:72px}
}

      + '<div class="pf-ft"><div class="pf-s12">今日一课 · Day 02 / 30</div><div class="pf-t16">' + esc(lesson.floatTitle) + '</div><div class="pf-s12">' + esc(lesson.floatSub) + "</div></div>"
      + '<button type="button" class="pf-x" data-act="dismiss" aria-label="收起这张卡">' + ICON.x + "</button></div>"
      + '<button type="button" class="pf-ask" data-act="ask" data-day="2">' + ICON.spark + '<span class="pf-ask-t">问 AI 助教：浏览器算不算 Harness？</span><span class="pf-badge">模拟</span>' + ICON.chev + "</button>"
      + '<div class="pf-btns"><button type="button" class="pf-b1" data-act="notes" data-day="2">' + ICON.doc + "看讲义</button>"
      + '<button type="button" class="pf-b2" data-act="poster">' + ICON.play + "完整视频</button></div></section>";
    return '<section class="pf-slide" data-day="2" data-i="1" style="background:#101014"><div class="pf-main">' + inner + "</div>" + rail(2) + cap(lesson) + '<div class="pf-vprog" aria-hidden="true"><i></i></div></section>';
  }
  function carouselSlide(lesson) {
    var page1 = '<article class="pf-page"><div class="pf-abody">'
      + '<div class="pf-am1 pf-mono"><span>AI AGENT DAILY</span><span data-pf="pager">1 / 2</span></div>'
      + '<div class="pf-num"><div class="pf-big pf-mono">03</div><div class="pf-nc"><span class="pf-tag">今日一课</span><span class="pf-nsub pf-mono">/ 30 天精读</span></div></div>'
      + "<h2>通用工具探索，专用工具守底线</h2>"
      + '<div class="pf-spec"><div class="pf-spl pf-mono"><span>通用 · 探索</span><span>专用 · 守底线</span></div>'
      + '<div class="pf-spbar"><div class="pf-ptr" style="left:10%"></div><div class="pf-ptr" style="left:90%"></div></div>'
      + '<div class="pf-sptx"><div><b>bash · Python</b><span>什么都能试</span></div><div class="is-r"><b>付款 · 删除 · 发送 · 部署</b><span>金额、校验、审批固定死</span></div></div></div>'
      + '<ol class="pf-ol"><li><span class="pf-n pf-mono">01</span><span class="pf-lt"><b>五类工具</b><br><em>感知 · 执行 · 协作 · 事件触发 · 用户沟通</em></span></li>'
      + '<li><span class="pf-n pf-mono">02</span><span class="pf-lt"><b>「模型即 Agent」</b><br><em>调哪个工具的决策搬进参数，工具仍在 Harness 执行</em></span></li>'
      + '<li><span class="pf-n pf-mono">03</span><span class="pf-lt"><b>三条学习路径</b><br><em>上下文适应 · 更新外部文档程序 · 更新模型参数</em></span></li></ol></div>'
      + '<div class="pf-afoot"><div><div class="pf-s13">左滑看下一页 · 后页为占位</div><div class="pf-fp"><i></i><b></b></div></div></div></article>';
    var page2 = '<article class="pf-page pf-ph"><div class="pf-abody">'
      + '<div class="pf-am1 pf-mono"><span>AI AGENT DAILY</span><span>2 / 2</span></div>'
      + "<h2>第 2 页 · 占位</h2>"
      + '<ol class="pf-ol"><li><span class="pf-n pf-mono">01</span><span class="pf-lt"><b>付款要单独的工具</b><br><em>金额、校验、审批固定下来。有 bash 和 Python 也不够。</em></span></li></ol>'
      + '<p><span class="pf-badge">占位</span> 这一页只放了讲义里的一个要点。</p></div>'
      + '<div class="pf-afoot"><div class="pf-s13">占位 · 后页没有更多核对过的正文</div></div></article>';
    return '<section class="pf-slide pf-slide-c" data-day="3" data-i="2">'
      + '<div class="pf-stage"><div class="pf-h" data-pf="h">' + page1 + page2 + "</div></div>"
      + '<div class="pf-dots" data-pf="dots"><i class="pf-d is-on"></i><i class="pf-d"></i></div>'
      + rail(3, true) + cap(lesson) + "</section>";
  }
  function gatesSlide(lesson) {
    var panel = '<div class="pf-panel"><div class="pf-mono pf-slab">3 layers of guardrails</div>' + GATES
      + '<div class="pf-hit"><span class="pf-am">HUMAN-IN-LOOP</span> 连续失败超阈值 · 高风险操作，拉人进来</div></div>';
    return frame(lesson, head(lesson) + panel);
  }
  function patternsSlide(lesson) {
    var cards = [
      ["01", "提议者-审核者", "Agent 写，人或另一个模型审"],
      ["02", "渐进式披露", "需要时再展开更多"],
      ["03", "只增不改", "记录只追加，不覆盖"],
      ["04", "边界集 + 保留集", "修好目标，不改坏旧的"]
    ];
    var html = '<div class="pf-pgrid">';
    cards.forEach(function (c) {
      html += '<div class="pf-pcard"><div class="pf-phrow"><div class="pf-pic" aria-hidden="true">' + ICON.spark + '</div><div class="pf-pn pf-mono">' + c[0] + "</div></div>"
        + '<div class="pf-pnm">' + esc(c[1]) + '</div><div class="pf-pex">' + esc(c[2]) + "</div></div>";
    });
    html += '<div class="pf-pcard pf-wide"><div class="pf-phrow"><div class="pf-pic" aria-hidden="true">' + ICON.spark + '</div></div><div class="pf-pn pf-mono">05</div>'
      + '<div class="pf-pnm">最小 diff + 可回滚</div><div class="pf-pex">只改一行，出错就撤回</div></div></div>'
      + '<div class="pf-dash pf-q3"><span>看到什么</span><i>→</i><span>能做什么</span><i>→</i><span>怎么验证</span></div>';
    return frame(lesson, head(lesson) + '<div class="pf-panel">' + html + "</div>");
  }
  function bars() {
    var html = "";
    for (var i = 0; i < 30; i++) html += '<i style="height:' + Math.max(3, Math.round(3 + (i * i) / 38)) + 'px"></i>';
    return html;
  }
  function codeSlide(lesson) {
    var code = '<div class="pf-code"><div class="pf-cdh pf-mono"><span class="pf-dt"></span><span class="pf-dt"></span><span class="pf-dt"></span><em>agent_loop.py</em></div>'
      + '<pre class="pf-pre"><span class="pf-k">while</span> <span class="pf-k">True</span>:\n  resp = llm(<span class="pf-hl">messages</span>, tools)\n  <span class="pf-hl">messages</span>.append(resp)\n  <span class="pf-k">if not</span> resp.tool_calls: <span class="pf-k">break</span>\n  <span class="pf-k">for</span> c <span class="pf-k">in</span> resp.tool_calls:\n    <span class="pf-hl">messages</span>.append(\n        tool_result(c.id, run(c)))</pre></div>'
      + '<div class="pf-growth"><div class="pf-gl pf-mono"><span>STEP 1</span><span>STEP 30</span></div><div class="pf-gb">' + bars() + '</div>'
      + '<div class="pf-gt">每轮重发整个 <span class="pf-am pf-mono">messages</span>：越来越长，成本涨</div></div>';
    return frame(lesson, head(lesson) + '<div class="pf-panel">' + code + "</div>");
  }

  var builders = { cover: coverSlide, video: videoSlide, carousel: carouselSlide, gates: gatesSlide, patterns: patternsSlide, code: codeSlide };
  var slides = LESSONS.map(function (lesson) { return builders[lesson.kind](lesson); }).join("");

  root.innerHTML = ''
    + '<div class="pf-top"><span class="pf-sp"></span><div class="pf-tabs" role="tablist" aria-label="关注和推荐">'
    + '<button type="button" data-act="follow" role="tab" aria-selected="false">关注</button>'
    + '<button type="button" data-act="rec" class="is-on" role="tab" aria-selected="true">推荐</button></div>'
    + '<button type="button" class="pf-ib" data-act="search" aria-label="搜索，演示">' + ICON.search + "</button></div>"
    + '<div class="pf-feed q-feed scroller" data-pf="feed" tabindex="0" aria-label="六课竖向 Feed，上下滑动切换">' + slides + "</div>"
    + '<div class="pf-follow" data-pf="follow" hidden><div><b>关注</b><p>演示 · 还没有关注的人。</p><button type="button" data-act="rec">返回推荐</button></div></div>'
    + '<div class="pf-scrim" data-pf="scrim" hidden></div>'
    + '<section class="pf-sheet" data-pf="sheet" hidden aria-label="讲义">'
    + '<div class="pf-handle" data-pf="handle" aria-hidden="true"></div>'
    + '<div class="pf-sh" data-pf="grab"><div class="pf-shr"><span class="pf-dtag pf-mono" data-pf="daytag"></span>'
    + '<button type="button" class="pf-ib" data-act="close" aria-label="关闭讲义" style="color:#5E5D59">' + ICON.x + "</button></div>"
    + '<h2 data-pf="title"></h2><div class="pf-meta" data-pf="meta"></div></div>'
    + '<div class="pf-tabs2" role="tablist"><button type="button" data-act="tab" data-tab="note" class="is-on">讲义</button>'
    + '<button type="button" data-act="tab" data-tab="video">视频</button>'
    + '<button type="button" data-act="tab" data-tab="ai">' + ICON.spark + " 问 AI</button></div>"
    + '<div class="pf-sbody scroller" data-pf="sbody"></div>'
    + '<div class="pf-quiz" data-pf="quiz" hidden><div class="pf-badge">30 秒</div><p class="pf-quiz-q" data-pf="question"></p>'
    + '<button type="button" class="pf-reveal" data-act="reveal">显示答案</button><p class="pf-quiz-a" data-pf="answer" hidden></p></div>'
    + '<div class="pf-sfoot"><button type="button" class="pf-o" data-act="quiz">30 秒小测 · 1 题</button>'
    + '<button type="button" class="pf-p" data-act="start">开始学习</button></div></section>'
    + '<div class="pf-toast" data-pf="toast" role="status" hidden></div>';

  var feed = root.querySelector("[data-pf=feed]");
  var sheet = root.querySelector("[data-pf=sheet]");
  var scrim = root.querySelector("[data-pf=scrim]");
  var follow = root.querySelector("[data-pf=follow]");
  var toastEl = root.querySelector("[data-pf=toast]");
  var sbody = root.querySelector("[data-pf=sbody]");
  var quizEl = root.querySelector("[data-pf=quiz]");
  var hScroller = root.querySelector("[data-pf=h]");
  var state = { sheet: 0, tab: "note", quiz: false, answer: false, follow: false };
  var toastTimer = 0;
  var reacts = loadReacts();

  function loadReacts() {
    try {
      var data = JSON.parse(localStorage.getItem("qbot-pf-react") || "{}");
      return { like: data.like || {}, star: data.star || {}, check: data.check || {} };
    } catch (e) {
      return { like: {}, star: {}, check: {} };
    }
  }
  function saveReacts() {
    try { localStorage.setItem("qbot-pf-react", JSON.stringify(reacts)); } catch (e) {}
  }
  function toast(msg) {
    toastEl.hidden = false;
    toastEl.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
  }
  function lessonByDay(day) {
    for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].day === day) return LESSONS[i];
    return LESSONS[0];
  }
  function currentIndex() {
    var slides = feed.querySelectorAll(".pf-slide");
    var h = feed.clientHeight || 1;
    var i = Math.round(feed.scrollTop / h);
    if (i < 0) i = 0;
    if (i > slides.length - 1) i = slides.length - 1;
    return i;
  }
  function go(i) {
    var slide = feed.querySelectorAll(".pf-slide")[i];
    if (!slide) return;
    feed.scrollTo({ top: slide.offsetTop, behavior: "smooth" });
  }
  function paintReacts() {
    root.querySelectorAll(".pf-rb").forEach(function (btn) {
      var act = btn.getAttribute("data-act");
      var day = btn.getAttribute("data-day");
      var on = !!(reacts[act] && reacts[act][day]);
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  function pointsHtml(lesson) {
    return "<ol class=\"pf-secs\">" + lesson.points.map(function (p, i) {
      return '<li><span class="pf-c pf-mono' + (i === 0 ? " is-on" : "") + '">' + pad(i + 1) + '</span><span class="pf-m"><b>'
        + esc(p[0]) + "</b><em>" + esc(p[1]) + '</em></span><span class="pf-du">' + esc(p[2]) + "</span></li>";
    }).join("") + "</ol>";
  }
  function chipsHtml(lesson) {
    return lesson.asks.map(function (a, i) {
      return '<button type="button" data-act="chip" data-i="' + i + '">' + esc(a[0]) + "</button>";
    }).join("");
  }
  function videoRow(lesson) {
    return '<div class="pf-vrow"><button type="button" class="pf-thumb" data-act="poster" aria-label="静态海报，演示"><span class="pf-badge">演示</span><span class="pf-pb">'
      + ICON.play + '</span><span class="pf-dur pf-mono">3:20</span></button><span class="pf-vt"><b>' + esc(lesson.videoTitle)
      + "</b><em>静态海报 · 演示 · 不能播放</em></span></div>";
  }
  function aiBox(lesson) {
    return '<div class="pf-aibox"><div class="pf-aih">' + ICON.spark + "模拟 · AI 助教 · 读完可以问问</div><div class=\"pf-qchips\">"
      + chipsHtml(lesson) + '</div><p class="pf-reply" data-pf="reply" hidden></p></div>';
  }
  function paintSheet() {
    var lesson = lessonByDay(state.sheet);
    root.querySelector("[data-pf=daytag]").textContent = dayLabel(lesson.day);
    root.querySelector("[data-pf=title]").textContent = lesson.sheetTitle;
    root.querySelector("[data-pf=meta]").textContent = lesson.meta;
    root.querySelectorAll("[data-act=tab]").forEach(function (btn) {
      var on = btn.getAttribute("data-tab") === state.tab;
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
    quizEl.hidden = !state.quiz;
    sbody.hidden = !!state.quiz;
    if (state.quiz) {
      root.querySelector("[data-pf=question]").textContent = lesson.quiz[0];
      var ans = root.querySelector("[data-pf=answer]");
      ans.hidden = !state.answer;
      ans.textContent = state.answer ? "答案 · " + lesson.quiz[1] : "";
      return;
    }
    var html = "";
    if (state.tab === "note") html = pointsHtml(lesson) + videoRow(lesson) + aiBox(lesson);
    else if (state.tab === "video") html = '<div class="pf-poster-lg"><span class="pf-badge">演示</span><span class="pf-pb">' + ICON.play + "</span></div><p class=\"pf-note\">静态海报，演示。这里没有视频文件，点播放也不会开始。</p>" + videoRow(lesson);
    else html = aiBox(lesson) + '<p class="pf-note">回答是写在页面里的模拟，没有发给模型。</p>';
    sbody.innerHTML = html;
  }
  function openSheet(day, tab) {
    state.sheet = day;
    state.tab = tab || "note";
    state.quiz = false;
    state.answer = false;
    sheet.hidden = false;
    scrim.hidden = false;
    sheet.style.setProperty("--pf-dy", "0px");
    root.classList.add("is-sheet");
    paintSheet();
  }
  function closeSheet() {
    state.sheet = 0;
    state.quiz = false;
    state.answer = false;
    sheet.hidden = true;
    scrim.hidden = true;
    root.classList.remove("is-sheet");
  }
  function setFollow(on) {
    state.follow = on;
    follow.hidden = !on;
    root.querySelector("[data-act=follow]").classList.toggle("is-on", on);
    root.querySelector("[data-act=follow]").setAttribute("aria-selected", on ? "true" : "false");
    root.querySelector("[data-act=rec]").classList.toggle("is-on", !on);
    root.querySelector("[data-act=rec]").setAttribute("aria-selected", on ? "false" : "true");
  }
  function showReply(i) {
    var lesson = lessonByDay(state.sheet || (currentIndex() + 1));
    var box = root.querySelector("[data-pf=reply]");
    if (!box || !lesson.asks[i]) return;
    box.hidden = false;
    box.textContent = "模拟 · " + lesson.asks[i][1];
  }
  function back() {
    if (state.follow) { setFollow(false); return true; }
    if (state.sheet) {
      if (state.quiz) {
        state.quiz = false;
        state.answer = false;
        paintSheet();
        return true;
      }
      closeSheet();
      return true;
    }
    if (currentIndex() > 0) { go(0); return true; }
    return false;
  }
  function holdBack() {
    var legacy = global.qbotFeed;
    var api = {
      back: back,
      closeDetail: function () {
        if (legacy && legacy !== api && typeof legacy.closeDetail === "function") {
          try { return legacy.closeDetail(); } catch (e) { return false; }
        }
        return false;
      }
    };
    global.qbotFeed = api;
  }

  root.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn || !root.contains(btn)) return;
    var act = btn.getAttribute("data-act");
    var day = +(btn.getAttribute("data-day") || state.sheet || (currentIndex() + 1));
    if (act === "like" || act === "star" || act === "check") {
      if (reacts[act][day]) delete reacts[act][day];
      else reacts[act][day] = 1;
      saveReacts();
      paintReacts();
      return;
    }
    if (act === "comment" || act === "share" || act === "plus" || act === "search") {
      toast("演示 · 没有接通");
      return;
    }
    if (act === "poster") { toast("演示 · 静态海报，没有视频"); return; }
    if (act === "notes") { openSheet(day, "note"); return; }
    if (act === "ask") { openSheet(day, "ai"); return; }
    if (act === "dismiss") {
      var card = btn.closest(".pf-fcard");
      if (card) card.hidden = true;
      return;
    }
    if (act === "follow") { setFollow(true); return; }
    if (act === "rec") { setFollow(false); return; }
    if (act === "close") { closeSheet(); return; }
    if (act === "tab") {
      state.tab = btn.getAttribute("data-tab");
      state.quiz = false;
      paintSheet();
      return;
    }
    if (act === "quiz") {
      state.quiz = true;
      state.answer = false;
      paintSheet();
      return;
    }
    if (act === "reveal") {
      state.answer = true;
      paintSheet();
      return;
    }
    if (act === "start") {
      reacts.check[day] = 1;
      saveReacts();
      paintReacts();
      toast("演示 · 已在本机打卡");
      return;
    }
    if (act === "chip") {
      state.tab = "ai";
      state.quiz = false;
      paintSheet();
      showReply(+(btn.getAttribute("data-i") || 0));
    }
  });

  if (hScroller) {
    hScroller.addEventListener("scroll", function () {
      var w = hScroller.clientWidth || 1;
      var page = Math.round(hScroller.scrollLeft / w);
      var dots = root.querySelectorAll("[data-pf=dots] .pf-d");
      for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("is-on", i === page);
      var label = hScroller.querySelector("[data-pf=pager]");
      if (label && page === 0) label.textContent = "1 / 2";
    }, { passive: true });
  }

  var drag = null;
  sheet.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest("button")) return;
    var onGrab = e.target.closest("[data-pf=handle], [data-pf=grab]");
    if (!onGrab) return;
    drag = { y: e.clientY, id: e.pointerId };
    sheet.classList.add("is-drag");
    if (sheet.setPointerCapture) { try { sheet.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  sheet.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dy = Math.max(0, e.clientY - drag.y);
    sheet.style.setProperty("--pf-dy", dy + "px");
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var dy = parseFloat(sheet.style.getPropertyValue("--pf-dy")) || 0;
    drag = null;
    sheet.classList.remove("is-drag");
    if (dy > 72) closeSheet();
    else sheet.style.setProperty("--pf-dy", "0px");
  }
  sheet.addEventListener("pointerup", endDrag);
  sheet.addEventListener("pointercancel", endDrag);
  scrim.addEventListener("click", closeSheet);

  global.addEventListener("qbot:tab", function (e) {
    if (!e.detail || e.detail.tab === "feed") return;
    if (state.sheet) closeSheet();
    if (state.follow) setFollow(false);
  });

  paintReacts();
  holdBack();
  global.QbotLessons = { holdBack: holdBack, back: back };
})(window);
</script>
<script type="module" src="chat/chat.js?v=__VERSION__"></script>
</body>
</html>
