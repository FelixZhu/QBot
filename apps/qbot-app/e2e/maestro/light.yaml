appId: io.github.felixzhu.qiandrive
---
- setDarkMode: disabled
- assertLightMode
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "搜索对话"
    timeout: 180000
- assertVisible: "演示，没有接通真实助手"
- assertVisible: "Info Bot，演示"
- assertVisible: "English Bot，演示"
- assertVisible: "Study Bot，演示"
- assertNotVisible: "Unable to load script"
- takeScreenshot:
    path: light-chat-home

- tapOn: "Info Bot，演示"
- extendedWaitUntil:
    visible: "返回会话列表"
    timeout: 20000
- assertVisible: "演示会话，没有接通 Info Bot"
- assertVisible: "虚构示例，不是新闻"
- takeScreenshot:
    path: light-demo-thread
- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "搜索对话"
    timeout: 20000
- assertNotVisible: "返回会话列表"
- assertVisible: "Info Bot，演示"

# 底栏在安全区上方。用坐标点标签，避免无障碍树里父节点和文字各算一个。
- tapOn:
    point: "50%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "搜索对话"
    timeout: 20000
- extendedWaitUntil:
    visible: "家人 · 照片，寄来一小片周末，虚构演示"
    timeout: 20000
- assertVisible: "与你有关"
- takeScreenshot:
    path: light-feed-top
- scrollUntilVisible:
    element: "造物镜 · 阿禾创作，下一种购物体验，虚构演示"
    direction: DOWN
    timeout: 40000
    speed: 40
    visibilityPercentage: 80
    centerElement: true
- assertNotVisible: "与你有关"
- takeScreenshot:
    path: light-feed-scrolled-down
- scrollUntilVisible:
    element: "家人 · 照片，寄来一小片周末，虚构演示"
    direction: UP
    timeout: 40000
    speed: 40
    visibilityPercentage: 80
- assertVisible: "与你有关"
- takeScreenshot:
    path: light-feed-scrolled-up
- scrollUntilVisible:
    element: "造物镜 · 阿禾创作，下一种购物体验，虚构演示"
    direction: DOWN
    timeout: 40000
    speed: 40
    visibilityPercentage: 80
    centerElement: true
- assertNotVisible: "与你有关"
- tapOn: "造物镜 · 阿禾创作，下一种购物体验，虚构演示"
- extendedWaitUntil:
    visible: "返回信息流"
    timeout: 15000
- assertVisible: "虚构图集。阿禾不是真实创作者。"
- takeScreenshot:
    path: light-feed-detail
- tapOn: "返回信息流"
- extendedWaitUntil:
    notVisible: "返回信息流"
    timeout: 15000
- assertVisible: "造物镜 · 阿禾创作，下一种购物体验，虚构演示"
- assertNotVisible: "与你有关"
- takeScreenshot:
    path: light-feed-restored

- tapOn:
    point: "83%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "最近更新"
    timeout: 60000
- assertNotVisible: "搜索对话"
- takeScreenshot:
    path: light-kb

- tapOn:
    point: "17%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "搜索对话"
    timeout: 20000
- assertVisible: "Info Bot，演示"
- takeScreenshot:
    path: light-chat-return
