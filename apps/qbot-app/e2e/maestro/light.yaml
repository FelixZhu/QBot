appId: io.github.felixzhu.qiandrive
---
- setDarkMode: disabled
- assertLightMode
- launchApp:
    clearState: true
    stopApp: true
- runFlow: wait-home.yaml
- takeScreenshot:
    path: light-chat-home

- tapOn: "Qbot"
- extendedWaitUntil:
    visible: "回复，或按住说话|.*这句可以长按选择.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*这句可以长按选择.*"
    direction: UP
    timeout: 20000
    speed: 40
    visibilityPercentage: 40
- extendedWaitUntil:
    visible: ".*这句可以长按选择.*"
    timeout: 30000
- assertVisible: ".*不是真实模型.*"
- assertNotVisible: "连接码"
- assertNotVisible: "这一版没有带上服务器地址"
- takeScreenshot:
    path: light-qbot-thread

# The button keeps the copy result after the two-second check fades.
- tapOn:
    text: "复制"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "已复制到剪贴板"
    timeout: 5000
- takeScreenshot:
    path: light-chat-copied

- longPressOn: ".*这句可以长按选择.*"
- extendedWaitUntil:
    visible: "Select all"
    timeout: 8000
- assertVisible: "Copy"
- takeScreenshot:
    path: light-chat-select
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn: "Copy"
- runFlow:
    when:
      visible: "Select all"
    commands:
      - tapOn: "Select all"
- tapOn: "Qbot"

- scrollUntilVisible:
    element:
      text: "第46点用来把正文撑开"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 40
- assertNotVisible: ".*这句可以长按选择.*"
- takeScreenshot:
    path: light-chat-scrolled
- scrollUntilVisible:
    element:
      text: ".*这句可以长按选择.*"
    direction: UP
    timeout: 20000
    speed: 40
    visibilityPercentage: 40

- tapOn: "添加"
- extendedWaitUntil:
    visible: ".*不会上传.*"
    timeout: 8000
- assertVisible: ".*模型也读不了.*"
- takeScreenshot:
    path: light-chat-add
- tapOn: "关闭"
- extendedWaitUntil:
    visible: "回复，或按住说话"
    timeout: 8000

- tapOn: "回复，或按住说话"
- extendedWaitUntil:
    visible: "回复 Qbot"
    timeout: 8000
- takeScreenshot:
    path: light-chat-keyboard
- inputText: "请慢点"
- extendedWaitUntil:
    visible: "请慢点"
    timeout: 8000
- tapOn: "发送"
- extendedWaitUntil:
    visible: "正在回复"
    timeout: 10000
- takeScreenshot:
    path: light-chat-sending
- tapOn: "发送中…"
- inputText: "马上这句"
- tapOn: "发送"
- extendedWaitUntil:
    visible: "立即发送"
    timeout: 10000
- takeScreenshot:
    path: light-chat-queued
- tapOn: "立即发送"
- extendedWaitUntil:
    notVisible: "立即发送"
    timeout: 10000
- tapOn: "停止"
- extendedWaitUntil:
    visible: "已停止"
    timeout: 15000
- takeScreenshot:
    path: light-chat-stopped

- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "Qbot"
    timeout: 20000
- assertNotVisible: "返回会话列表"
- tapOn: "Qbot"
- extendedWaitUntil:
    visible: "回复，或按住说话"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "马上这句"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 40
- assertVisible: "已停止"
- assertNotVisible: "An error occurred"
- assertNotVisible: "服务器没有完成这条回复"
- takeScreenshot:
    path: light-chat-history
- tapOn: "添加"
- extendedWaitUntil:
    visible: ".*不会上传.*"
    timeout: 8000
- tapOn: "文件"
- extendedWaitUntil:
    visible: "qbot-local.txt"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "qbot-local.txt"
    commands:
      - tapOn: "qbot-local.txt"
- runFlow:
    when:
      notVisible: "添加"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible: ".*没有上传.*"
    commands:
      - tapOn: "添加"
      - extendedWaitUntil:
          visible: "放上本地示例"
          timeout: 8000
      - tapOn: "放上本地示例"
- extendedWaitUntil:
    visible: ".*没有上传.*"
    timeout: 10000
- assertVisible: ".*模型读不了.*"
- assertVisible: "不能发送"
- assertNotVisible: "正在回复"
- takeScreenshot:
    path: light-chat-file
- tapOn: "不能发送"
- assertNotVisible: "正在回复"
- tapOn: "移除 qbot-local.txt"
- extendedWaitUntil:
    notVisible: "qbot-local.txt"
    timeout: 8000
- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "个人对话"
    timeout: 20000
- assertNotVisible: "返回会话列表"

# 底栏在安全区上方。用坐标点标签，避免无障碍树里父节点和文字各算一个。
- tapOn:
    point: "50%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "Qbot"
    timeout: 20000
- extendedWaitUntil:
    visible: "追加进上下文"
    timeout: 20000
- assertVisible: "DAY 01 / 30"
- assertVisible: "Study Bot"
- assertVisible: "关注"
- assertNotVisible: "点赞"
- assertNotVisible: "看讲义"
- takeScreenshot:
    path: light-feed-top
# 一次滑动只翻一张。不用 scrollUntilVisible，那一下会甩过后面的课。
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "同一模型，差距在 Harness"
    timeout: 8000
- assertNotVisible: "追加进上下文"
- assertNotVisible: "消息列表"
- takeScreenshot:
    path: light-feed-scrolled-down
- swipe:
    start: "50%,30%"
    end: "50%,75%"
    duration: 600
- extendedWaitUntil:
    visible: "追加进上下文"
    timeout: 8000
- assertVisible: "DAY 01 / 30"
- assertNotVisible: "同一模型，差距在 Harness"
- takeScreenshot:
    path: light-feed-scrolled-up
- tapOn: "DAY 01 / 30，轻点进入"
- extendedWaitUntil:
    visible: "返回信息流"
    timeout: 15000
- assertVisible: "模拟"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot:
    path: light-feed-detail
- tapOn: "视频"
- extendedWaitUntil:
    visible: "演示"
    timeout: 8000
- assertVisible: "播放演示"
- takeScreenshot:
    path: light-feed-video
- tapOn: "小游戏"
- extendedWaitUntil:
    visible: "检查答案"
    timeout: 8000
- takeScreenshot:
    path: light-feed-game
- tapOn: "返回信息流"
- extendedWaitUntil:
    notVisible: "返回信息流"
    timeout: 15000
- assertVisible: "追加进上下文"
- assertVisible: "DAY 01 / 30"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot:
    path: light-feed-restored

