    timeout: 8000
- assertNotVisible: "粉丝"
- takeScreenshot:
    path: light-feed-demo-info-account
- tapOn: "返回上一页"
- extendedWaitUntil:
    visible: "今日三条信号"
    timeout: 8000
- tapOn: "返回封面"
- extendedWaitUntil:
    visible: "Info Bot 样例封面"
    timeout: 8000
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "English Bot 样例封面"
    timeout: 8000
- takeScreenshot:
