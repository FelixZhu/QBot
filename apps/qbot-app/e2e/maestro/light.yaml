appId: io.github.felixzhu.qiandrive
---
- setDarkMode: disabled
- assertLightMode
- launchApp:
    clearState: true
    stopApp: true
- runFlow: wait-home.yaml
- takeScreenshot:
    path: light-chat-home

- tapOn: "新对话"
- extendedWaitUntil:
    visible: ".*这句可以长按选择.*"
    timeout: 30000
- assertVisible: ".*不是真实模型.*"
- assertNotVisible: "连接码"
- assertNotVisible: "这一版没有带上服务器地址"
- takeScreenshot:
    path: light-qbot-thread

# The button keeps the copy result after the two-second check fades.
- tapOn:
    text: "复制"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "已复制到剪贴板"
    timeout: 5000
- takeScreenshot:
    path: light-chat-copied

- longPressOn: ".*这句可以长按选择.*"
- extendedWaitUntil:
    visible: "Select all"
    timeout: 8000
- assertVisible: "Copy"
- takeScreenshot:
    path: light-chat-select
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn: "Copy"
- runFlow:
    when:
      visible: "Select all"
    commands:
      - tapOn: "Select all"
- tapOn: "QBot"

- swipe:
    start: "50%,70%"
    end: "50%,45%"
    duration: 400
- takeScreenshot:
    path: light-chat-scrolled
- swipe:
    start: "50%,45%"
    end: "50%,75%"
    duration: 400

- tapOn: "添加"
- extendedWaitUntil:
    visible: ".*不会上传.*"
    timeout: 8000
- assertVisible: ".*模型也读不了.*"
- takeScreenshot:
    path: light-chat-add
- tapOn: "关闭"
- extendedWaitUntil:
    visible: "回复，或按住说话"
    timeout: 8000

- tapOn: "回复，或按住说话"
- extendedWaitUntil:
    visible: "回复 QBot"
    timeout: 8000
- takeScreenshot:
    path: light-chat-keyboard
- inputText: "请慢点"
- extendedWaitUntil:
    visible: "请慢点"
    timeout: 8000
- tapOn: "发送"
- extendedWaitUntil:
    visible: "正在回复"
    timeout: 10000
- takeScreenshot:
    path: light-chat-sending
- tapOn: "发送中…"
- inputText: "马上这句"
- tapOn: "发送"
- extendedWaitUntil:
    visible: "立即发送"
    timeout: 10000
- takeScreenshot:
    path: light-chat-queued
- tapOn: "立即发送"
- extendedWaitUntil:
    notVisible: "立即发送"
    timeout: 10000
- tapOn: "停止"
- extendedWaitUntil:
    visible: "已停止"
    timeout: 15000
- takeScreenshot:
    path: light-chat-stopped

- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "新对话"
    timeout: 20000
- assertNotVisible: "返回会话列表"
- tapOn: "新对话"
- extendedWaitUntil:
    visible: "马上这句"
    timeout: 20000
- assertVisible: "已停止"
- assertNotVisible: "An error occurred"
- assertNotVisible: "服务器没有完成这条回复"
- takeScreenshot:
    path: light-chat-history
- tapOn: "添加"
- extendedWaitUntil:
    visible: ".*不会上传.*"
    timeout: 8000
- tapOn: "文件"
- extendedWaitUntil:
    visible: "qbot-local.txt"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "qbot-local.txt"
    commands:
      - tapOn: "qbot-local.txt"
- runFlow:
    when:
      notVisible: "添加"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible: ".*没有上传.*"
    commands:
      - tapOn: "添加"
      - extendedWaitUntil:
          visible: "放上本地示例"
          timeout: 8000
      - tapOn: "放上本地示例"
- extendedWaitUntil:
    visible: ".*没有上传.*"
    timeout: 10000
- assertVisible: ".*模型读不了.*"
- assertVisible: "不能发送"
- assertNotVisible: "正在回复"
- takeScreenshot:
    path: light-chat-file
- tapOn: "不能发送"
- assertNotVisible: "正在回复"
- tapOn: "移除 qbot-local.txt"
- extendedWaitUntil:
    notVisible: "qbot-local.txt"
    timeout: 8000
- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "个人对话"
    timeout: 20000
- assertNotVisible: "返回会话列表"

# 今日是 Qbot 的两张手写卡。点开的是种子 HTML，返回留在原来的列表。
- tapOn:
    point: "17%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "get this over the line"
    timeout: 20000
- assertVisible: "Qbot"
- assertVisible: "关注"
- assertNotVisible: "样例"
- assertNotVisible: "Study Bot"
- assertNotVisible: "AI DAILY SIGNAL"
- takeScreenshot:
    path: light-feed-top
- scrollUntilVisible:
    element: "三个入口：今日、对话、知识库"
    direction: DOWN
    timeout: 15000
- takeScreenshot:
    path: light-feed-scrolled-down
- scrollUntilVisible:
    element: "get this over the line"
    direction: UP
    timeout: 15000
- takeScreenshot:
    path: light-feed-scrolled-up
- tapOn: "get this over the line"
- extendedWaitUntil:
    visible: ".*没有音频.*"
    timeout: 20000
- takeScreenshot:
    path: light-feed-detail
- tapOn: "返回"
- extendedWaitUntil:
    visible: "get this over the line"
    timeout: 10000
- assertNotVisible: ".*没有音频.*"
- takeScreenshot:
    path: light-feed-restored
- tapOn: "推荐"
- assertVisible: "三个入口：今日、对话、知识库"

- tapOn:
    point: "83%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "最近更新"
    timeout: 60000
- assertNotVisible: "Qbot"
- takeScreenshot:
    path: light-kb

- tapOn:
    point: "50%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "新对话"
    timeout: 20000
- assertNotVisible: "Info Bot，演示"
- takeScreenshot:
    path: light-chat-return
