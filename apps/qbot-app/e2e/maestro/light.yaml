- tapOn: "返回上一页"
- tapOn: "返回封面"

- tapOn:
    point: "83%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "最近更新"
    timeout: 60000
- assertNotVisible: "Qbot"
- takeScreenshot:
