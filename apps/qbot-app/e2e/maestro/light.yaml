appId: io.github.felixzhu.qiandrive
---
- setDarkMode: disabled
- assertLightMode
- launchApp:
    clearState: true
    stopApp: true
- runFlow: wait-home.yaml
- takeScreenshot:
    path: light-chat-home

- tapOn: "Info Bot，演示"
- extendedWaitUntil:
    visible: "返回会话列表"
    timeout: 20000
- assertVisible: "演示会话，没有接通 Info Bot。下面是虚构示例，不是新闻、引用、日期或价格。"
- takeScreenshot:
    path: light-demo-thread
- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "搜索对话"
    timeout: 20000
- assertNotVisible: "返回会话列表"
- assertVisible: "Info Bot，演示"

# 底栏在安全区上方。用坐标点标签，避免无障碍树里父节点和文字各算一个。
- tapOn:
    point: "50%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "搜索对话"
    timeout: 20000
- extendedWaitUntil:
    visible: "追加进上下文"
    timeout: 20000
- assertVisible: "DAY 01 / 30"
- takeScreenshot:
    path: light-feed-top
- scrollUntilVisible:
    element: "看讲义"
    direction: DOWN
    timeout: 40000
    speed: 40
    visibilityPercentage: 60
    centerElement: true
- assertVisible: "同一模型，差距在 Harness"
- assertNotVisible: "追加进上下文"
- takeScreenshot:
    path: light-feed-scrolled-down
- scrollUntilVisible:
    element: "追加进上下文"
    direction: UP
    timeout: 40000
    speed: 40
    visibilityPercentage: 40
- assertVisible: "追加进上下文"
- assertVisible: "DAY 01 / 30"
- assertNotVisible: "看讲义"
- takeScreenshot:
    path: light-feed-scrolled-up
- scrollUntilVisible:
    element: "看讲义"
    direction: DOWN
    timeout: 40000
    speed: 40
    visibilityPercentage: 60
    centerElement: true
- tapOn: "看讲义"
- extendedWaitUntil:
    visible: "关闭讲义"
    timeout: 15000
- assertVisible: "30 秒小测 · 1 题"
- takeScreenshot:
    path: light-feed-detail
- tapOn: "关闭讲义"
- extendedWaitUntil:
    notVisible: "关闭讲义"
    timeout: 15000
- assertVisible: "看讲义"
- assertNotVisible: "追加进上下文"
- takeScreenshot:
    path: light-feed-restored

- tapOn:
    point: "83%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "最近更新"
    timeout: 60000
- assertNotVisible: "搜索对话"
- takeScreenshot:
    path: light-kb

- tapOn:
    point: "17%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "搜索对话"
    timeout: 20000
- assertVisible: "Info Bot，演示"
- takeScreenshot:
    path: light-chat-return
