appId: io.github.felixzhu.qiandrive
---
- setDarkMode: disabled
- assertLightMode
- launchApp:
    clearState: true
    stopApp: true
- runFlow: wait-home.yaml
- takeScreenshot:
    path: light-chat-home

- tapOn: "Qbot"
- extendedWaitUntil:
    visible: "发消息"
    timeout: 20000
- assertVisible: "这一版没有带上服务器地址"
- assertNotVisible: "连接码"
- takeScreenshot:
    path: light-qbot-thread
- tapOn: "返回会话列表"
- extendedWaitUntil:
    visible: "Qbot"
    timeout: 20000
- assertNotVisible: "返回会话列表"

# 底栏在安全区上方。用坐标点标签，避免无障碍树里父节点和文字各算一个。
- tapOn:
    point: "50%,93%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "Qbot"
    timeout: 20000
- extendedWaitUntil:
    visible: "追加进上下文"
    timeout: 20000
- assertVisible: "DAY 01 / 30"
- assertVisible: "Study Bot"
- assertVisible: "关注"
- assertNotVisible: "点赞"
- assertNotVisible: "看讲义"
- takeScreenshot:
    path: light-feed-top
# 一次滑动只翻一张。不用 scrollUntilVisible，那一下会甩过后面的课。
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "同一模型，差距在 Harness"
    timeout: 8000
- assertNotVisible: "追加进上下文"
- assertNotVisible: "消息列表"
- takeScreenshot:
    path: light-feed-scrolled-down
- swipe:
    start: "50%,30%"
    end: "50%,75%"
    duration: 600
- extendedWaitUntil:
    visible: "追加进上下文"
    timeout: 8000
- assertVisible: "DAY 01 / 30"
- assertNotVisible: "同一模型，差距在 Harness"
- takeScreenshot:
    path: light-feed-scrolled-up
- tapOn: "DAY 01 / 30，轻点进入"
- extendedWaitUntil:
    visible: "返回信息流"
    timeout: 15000
- assertVisible: "模拟"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot:
    path: light-feed-detail
- tapOn: "视频"
- extendedWaitUntil:
    visible: "演示"
    timeout: 8000
- assertVisible: "播放演示"
- takeScreenshot:
    path: light-feed-video
- tapOn: "小游戏"
- extendedWaitUntil:
    visible: "检查答案"
    timeout: 8000
- takeScreenshot:
    path: light-feed-game
- tapOn: "返回信息流"
- extendedWaitUntil:
    notVisible: "返回信息流"
    timeout: 15000
- assertVisible: "追加进上下文"
- assertVisible: "DAY 01 / 30"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot:
    path: light-feed-restored

# 六课后面接着三张样例。每次只翻一张。
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "同一模型，差距在 Harness"
    timeout: 8000
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "通用工具探索，专用工具守底线"
    timeout: 8000
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "DAY 04 / 30"
    timeout: 8000
- swipe:
    start: "50%,75%"
    end: "50%,30%"
    duration: 600
- extendedWaitUntil:
    visible: "DAY 05 / 30"
