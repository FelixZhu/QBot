appId: io.github.felixzhu.qiandrive
---
- launchApp:
    stopApp: true
- runFlow: wait-home.yaml
- tapOn: "新对话"
- extendedWaitUntil:
    visible: "未同步"
    timeout: 12000
- scrollUntilVisible:
    element:
      text: ".*这句可以长按选择.*"
    direction: UP
    timeout: 15000
- assertNotVisible: "同步中"
- takeScreenshot:
    path: light-chat-stale
