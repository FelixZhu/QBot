appId: io.github.felixzhu.qiandrive
---
- setDarkMode: enabled
- assertDarkMode
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "get this over the line|三个入口：今日、对话、知识库"
    timeout: 30000
- assertVisible: "今日"
- takeScreenshot:
    path: today-narrow-dark-english
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- extendedWaitUntil:
    visible: "三个入口：今日、对话、知识库"
    timeout: 10000
- takeScreenshot:
    path: today-narrow-dark-info
