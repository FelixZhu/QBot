appId: io.github.felixzhu.qiandrive
---
# The Pixel launcher sometimes puts an "isn't responding" dialog over a
# screen that has already drawn. Dismiss it, then require the chat home.
- repeat:
    times: 20
    while:
      notVisible: "新对话"
    commands:
    - tapOn:
        text: "对话"
        optional: true
    - runFlow:
        when:
          visible: "Close app"
        commands:
          - tapOn: "Close app"
    - runFlow:
        when:
          visible: "Wait"
        commands:
          - tapOn: "Wait"
    - extendedWaitUntil:
        visible: "新对话"
        timeout: 3000
        optional: true
- assertVisible: "新对话"
- assertVisible: "个人对话"
- assertNotVisible: "Info Bot，演示"
- assertNotVisible: "English Bot，演示"
- assertNotVisible: "Study Bot，演示"
- assertNotVisible: "Unable to load script"
