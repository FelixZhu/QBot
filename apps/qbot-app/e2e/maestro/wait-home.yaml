appId: io.github.felixzhu.qiandrive
---
# The Pixel launcher sometimes puts an "isn't responding" dialog over a
# screen that has already drawn. Dismiss it, then require the chat home.
- repeat:
    times: 20
    while:
      notVisible: "搜索对话"
    commands:
      - runFlow:
          when:
            visible: "Close app"
          commands:
            - tapOn: "Close app"
      - runFlow:
          when:
            visible: "Wait"
          commands:
            - tapOn: "Wait"
      - extendedWaitUntil:
          visible: "搜索对话"
          timeout: 3000
          optional: true
- assertVisible: "搜索对话"
- assertVisible: "点第一行「真实对话」填写地址和访问令牌。下面三条是演示。"
- assertVisible: "Info Bot，演示"
- assertVisible: "English Bot，演示"
- assertVisible: "Study Bot，演示"
- assertNotVisible: "Unable to load script"
