# Insert these two lines in the cluster pg_hba.conf BEFORE any broader
# `host ... ident` line. PostgreSQL uses the first matching line.
# Replace the role and database names if you did not use `qbot`.
# Do not add a rule for 0.0.0.0/0 or any non-loopback address.

host    qbot    qbot    127.0.0.1/32    scram-sha-256
host    qbot    qbot    ::1/128         scram-sha-256
